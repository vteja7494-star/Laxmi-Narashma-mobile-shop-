<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laxmi Narasimha Mobile - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #020617, #0f172a);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #111827;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      color: white;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 24px;
      color: #38bdf8;
    }

    .logo p {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      margin-top: 10px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      color: #38bdf8;
      font-size: 14px;
    }

    .otp-step {
      display: none;
    }

    .back {
      margin-top: 15px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>Laxmi Narasimha Mobile</h1>
      <p>Mobile Repair & Service</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="mobileTab">
        Mobile
      </button>

      <button class="tab" id="emailTab">
        Email
      </button>
    </div>

    <!-- MOBILE LOGIN -->

    <div id="mobileLogin">

      <h2>Mobile OTP Login</h2>

      <label for="phone">
        Mobile Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="+91 9876543210"
        inputmode="tel"
      >

      <button id="sendMobileOtpBtn">
        SEND OTP
      </button>

    </div>

    <!-- EMAIL LOGIN -->

    <div id="emailLogin" style="display:none;">

      <h2>Email OTP Login</h2>

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <button id="sendEmailOtpBtn">
        SEND OTP
      </button>

    </div>

    <!-- OTP -->

    <div id="otpStep" class="otp-step">

      <h2>Enter OTP</h2>

      <p id="otpInfo"
         style="text-align:center;color:#94a3b8;margin-bottom:15px;">
      </p>

      <label for="otp">
        6-Digit OTP
      </label>

      <input
        type="text"
        id="otp"
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        style="text-align:center;letter-spacing:8px;font-size:24px;font-weight:bold;"
      >

      <button id="verifyOtpBtn">
        VERIFY OTP
      </button>

      <button id="changeLoginBtn" class="secondary">
        CHANGE LOGIN
      </button>

    </div>

    <div id="message" class="message"></div>

    <div class="back">
      Secure login powered by Supabase
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://antkerjfmdmyitiehnty.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_gzORKzM9wqsWQqUjlp0fq6g_MHjyz4Bs";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const mobileTab =
  document.getElementById("mobileTab");

const emailTab =
  document.getElementById("emailTab");

const mobileLogin =
  document.getElementById("mobileLogin");

const emailLogin =
  document.getElementById("emailLogin");

const phoneInput =
  document.getElementById("phone");

const emailInput =
  document.getElementById("email");

const otpStep =
  document.getElementById("otpStep");

const otpInput =
  document.getElementById("otp");

const otpInfo =
  document.getElementById("otpInfo");

const message =
  document.getElementById("message");

const sendMobileOtpBtn =
  document.getElementById("sendMobileOtpBtn");

const sendEmailOtpBtn =
  document.getElementById("sendEmailOtpBtn");

const verifyOtpBtn =
  document.getElementById("verifyOtpBtn");

const changeLoginBtn =
  document.getElementById("changeLoginBtn");


let loginType = "";
let currentValue = "";


function showMessage(text, success = false) {

  message.textContent = text;

  message.style.color =
    success ? "#22c55e" : "#38bdf8";
}


function showMobileLogin() {

  loginType = "";

  mobileTab.classList.add("active");
  emailTab.classList.remove("active");

  mobileLogin.style.display = "block";
  emailLogin.style.display = "none";
  otpStep.style.display = "none";

  showMessage("");
}


function showEmailLogin() {

  loginType = "";

  emailTab.classList.add("active");
  mobileTab.classList.remove("active");

  emailLogin.style.display = "block";
  mobileLogin.style.display = "none";
  otpStep.style.display = "none";

  showMessage("");
}


mobileTab.addEventListener(
  "click",
  showMobileLogin
);


emailTab.addEventListener(
  "click",
  showEmailLogin
);


/* MOBILE OTP */

sendMobileOtpBtn.addEventListener(
  "click",
  async function () {

    const phone =
      phoneInput.value.trim();

    if (!phone) {
      showMessage("Please enter your mobile number.");
      return;
    }

    if (!/^\+?[0-9]{10,15}$/.test(phone)) {
      showMessage("Please enter a valid mobile number.");
      return;
    }

    sendMobileOtpBtn.disabled = true;
    sendMobileOtpBtn.textContent = "SENDING...";

    showMessage("Sending mobile OTP...");

    const { error } =
      await supabaseClient.auth.signInWithOtp({
        phone: phone
      });

    if (error) {

      console.error(error);

      showMessage(
        "Mobile OTP failed: " +
        error.message
      );

      sendMobileOtpBtn.disabled = false;
      sendMobileOtpBtn.textContent = "SEND OTP";

      return;
    }

    loginType = "phone";
    currentValue = phone;

    mobileLogin.style.display = "none";
    emailLogin.style.display = "none";
    otpStep.style.display = "block";

    otpInfo.textContent =
      "OTP sent to " + phone;

    otpInput.value = "";
    otpInput.focus();

    showMessage("Mobile OTP sent successfully.");

  }
);


/* EMAIL OTP */

sendEmailOtpBtn.addEventListener(
  "click",
  async function () {

    const email =
      emailInput.value.trim();

    if (!email) {
      showMessage("Please enter your email.");
      return;
    }

    if (!email.includes("@")) {
      showMessage("Please enter a valid email.");
      return;
    }

    sendEmailOtpBtn.disabled = true;
    sendEmailOtpBtn.textContent = "SENDING...";

    showMessage("Sending email OTP...");

    const { error } =
      await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          shouldCreateUser: true
        }
      });

    if (error) {

      console.error(error);

      showMessage(
        "Email OTP failed: " +
        error.message
      );

      sendEmailOtpBtn.disabled = false;
      sendEmailOtpBtn.textContent = "SEND OTP";

      return;
    }

    loginType = "email";
    currentValue = email;

    mobileLogin.style.display = "none";
    emailLogin.style.display = "none";
    otpStep.style.display = "block";

    otpInfo.textContent =
      "OTP sent to " + email;

    otpInput.value = "";
    otpInput.focus();

    showMessage("Email OTP sent successfully.");

  }
);


/* VERIFY OTP */

verifyOtpBtn.addEventListener(
  "click",
  async function () {

    const otp =
      otpInput.value.trim();

    if (!/^\d{6}$/.test(otp)) {

      showMessage(
        "Please enter the 6-digit OTP."
      );

      return;
    }

    verifyOtpBtn.disabled = true;
    verifyOtpBtn.textContent = "VERIFYING...";

    showMessage("Verifying OTP...");

    let result;

    if (loginType === "phone") {

      result =
        await supabaseClient.auth.verifyOtp({
          phone: currentValue,
          token: otp,
          type: "sms"
        });

    } else {

      result =
        await supabaseClient.auth.verifyOtp({
          email: currentValue,
          token: otp,
          type: "email"
        });

    }

    if (result.error) {

      console.error(result.error);

      showMessage(
        "Invalid OTP: " +
        result.error.message
      );

      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = "VERIFY OTP";

      return;
    }

    if (result.data.session) {

      showMessage(
        "Login successful!",
        true
      );

      setTimeout(function () {

        window.location.href =
          "index.html";

      }, 1000);

    }

  }
);


/* CHANGE LOGIN */

changeLoginBtn.addEventListener(
  "click",
  function () {

    loginType = "";
    currentValue = "";

    otpInput.value = "";

    otpStep.style.display = "none";

    if (mobileTab.classList.contains("active")) {

      mobileLogin.style.display = "block";

    } else {

      emailLogin.style.display = "block";

    }

    showMessage("");

  }
);


/* OTP INPUT */

otpInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 6);

  }
);

</script>

</body>
</html>
