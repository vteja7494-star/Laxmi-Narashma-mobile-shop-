<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Laxmi Narashma Mobile Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: #050505;
      color: white;
    }

    .login-page {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(80,80,80,.18), transparent 35%),
        #050505;
    }

    /* Cinematic phone background */
    .phone-glow {
      position: absolute;
      width: 330px;
      height: 650px;
      border-radius: 45px;
      background: linear-gradient(145deg, #252525, #080808);
      border: 2px solid rgba(255,255,255,.15);
      box-shadow:
        0 0 80px rgba(255,255,255,.12),
        0 0 180px rgba(255,255,255,.05);
      transform: rotate(-8deg);
      opacity: .72;
      animation: phoneFloat 6s ease-in-out infinite;
    }

    .phone-screen {
      position: absolute;
      inset: 9px;
      border-radius: 38px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, #444, transparent 25%),
        linear-gradient(145deg, #151515, #000);
    }

    .phone-camera {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 8px;
      border-radius: 20px;
      background: #000;
      opacity: .9;
    }

    .nothing-dots {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 1px);
      background-size: 13px 13px;
      opacity: .07;
    }

    .ghost-brand {
      position: absolute;
      font-size: clamp(55px, 12vw, 170px);
      font-weight: 900;
      letter-spacing: -6px;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.07);
      transform: rotate(-7deg);
      user-select: none;
    }

    .ghost-brand.top {
      top: 8%;
      left: -8%;
    }

    .ghost-brand.bottom {
      bottom: 7%;
      right: -10%;
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 10;
      width: min(420px, 90%);
      padding: 38px 32px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(10,10,10,.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 100px rgba(0,0,0,.65);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand small {
      display: block;
      color: #999;
      letter-spacing: 4px;
      font-size: 10px;
      margin-bottom: 8px;
    }

    .brand h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .brand p {
      margin-top: 8px;
      color: #888;
      font-size: 13px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #333;
      border-radius: 12px;
      outline: none;
      background: #111;
      color: white;
      font-size: 14px;
    }

    .input-group input:focus {
      border-color: #888;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: 800;
      cursor: pointer;
      transition: .25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      background: #ddd;
    }

    .signup-btn {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .signup-btn:hover {
      background: #151515;
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #777;
      text-decoration: none;
      font-size: 12px;
    }

    .back-home:hover {
      color: white;
    }

    @keyframes phoneFloat {
      0%,100% {
        transform: translateY(0) rotate(-8deg);
      }
      50% {
        transform: translateY(-18px) rotate(-5deg);
      }
    }

    @media (max-width: 600px) {
      .phone-glow {
        width: 230px;
        height: 470px;
        opacity: .45;
      }

      .login-card {
        padding: 30px 22px;
      }

      .ghost-brand {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">

    <div class="ghost-brand top">LAXMI NARASHMA</div>
    <div class="ghost-brand bottom">MOBILE SHOP</div>

    <div class="phone-glow">
      <div class="phone-screen">
        <div class="phone-camera"></div>
        <div class="nothing-dots"></div>
      </div>
    </div>

    <section class="login-card">

      <div class="brand">
        <small>LAXMI NARASHMA</small>
        <h1>MOBILE SHOP</h1>
        <p>Login to enter Mobile AI Assistant</p>
      </div>

      <form id="loginForm">

        <div class="input-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button class="login-btn" type="submit">
          LOGIN →
        </button>

      </form>

      <button class="signup-btn" id="signupBtn">
        CREATE ACCOUNT
      </button>

      <div class="message" id="message"></div>

      <a href="index.html" class="back-home">
        ← Back to website
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://antkerjfmdmyitiehnty.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "YOUR_EXISTING_PUBLISHABLE_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Login successful...";

      setTimeout(() => {
        window.location.href = "ai.html";
      }, 500);
    });

    signupBtn.addEventListener("click", async function() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.textContent =
          "Enter email and password first.";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      message.textContent = "Creating account...";

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Account created. Check your email if confirmation is required.";
    });
  </script>

</html>
