<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laxmi Narashma Mobile Shop - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(40,40,40,.35), transparent 35%),
        linear-gradient(135deg, #050505, #111, #000);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: 25px;
      letter-spacing: 3px;
      font-weight: 800;
    }

    .brand p {
      margin-top: 8px;
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .login-box {
      background: rgba(20,20,20,.82);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 25px;
      padding: 30px 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 80px rgba(0,0,0,.65);
    }

    .login-box h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-box .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 7px;
      letter-spacing: 1px;
    }

    .field input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #777;
    }

    .login-btn,
    .signup-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }

    .login-btn {
      border: none;
      background: white;
      color: black;
    }

    .signup-btn {
      border: 1px solid #333;
      background: transparent;
      color: white;
    }

    .login-btn:hover {
      opacity: .9;
    }

    .signup-btn:hover {
      background: #181818;
    }

    #message {
      text-align: center;
      min-height: 20px;
      margin-top: 18px;
      color: #aaa;
      font-size: 13px;
    }

    .bg-text {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
      font-size: clamp(70px, 18vw, 190px);
      font-weight: 900;
      white-space: nowrap;
      color: rgba(255,255,255,.025);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
  </style>
</head>

<body>

  <div class="bg-text">
    LAXMI NARASHMA
  </div>

  <div class="container">

    <div class="brand">
      <h1>LAXMI NARASHMA</h1>
      <p>MOBILE SHOP</p>
    </div>

    <div class="login-box">

      <h2>Welcome Back</h2>

      <div class="subtitle">
        Login to continue to Mobile AI Assistant
      </div>

      <form id="loginForm">

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button
          type="submit"
          class="login-btn"
        >
          LOGIN
        </button>

      </form>

      <button
        type="button"
        class="signup-btn"
        id="signupBtn"
      >
        CREATE ACCOUNT
      </button>

      <div id="message"></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*
      IMPORTANT:
      Use the SAME Supabase URL and SAME PUBLISHABLE KEY
      that are already working in your script.js.

      Do NOT use the old placeholder:
      YOUR_EXISTING_PUBLISHABLE_KEY
    */

    const SUPABASE_URL =
      "https://antkerjfmdmyitiehnty.supabase.co";

    /*
      Paste your existing sb_publishable_... key here.
      It is the same publishable key from script.js.
    */
    const SUPABASE_PUBLISHABLE_KEY =
       "sb_publishable_gzORKzM9wqsWqUjlp0fq6g_MHjyz4Bs";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;

        message.textContent =
          "Logging in...";

        const { error } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });

        if (error) {

          message.textContent =
            error.message;

          return;
        }

        message.textContent =
          "Login successful...";

        setTimeout(function() {

          window.location.href =
            "ai.html";

        }, 500);

      }
    );


    signupBtn.addEventListener(
      "click",
      async function() {

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;

        if (!email || !password) {

          message.textContent =
            "Enter email and password first.";

          return;
        }

        if (password.length < 6) {

          message.textContent =
            "Password must be at least 6 characters.";

          return;
        }

        message.textContent =
          "Creating account...";

        const { error } =
          await supabaseClient.auth
            .signUp({
              email: email,
              password: password
            });

        if (error) {

          message.textContent =
            error.message;

          return;
        }

        message.textContent =
          "Account created. Check your email if confirmation is required.";

      }
    );
  </script>

</body>
</html>
