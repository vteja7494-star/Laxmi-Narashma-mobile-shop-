<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laxmi Narashma Mobile Shop - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(40,40,40,.35), transparent 35%),
        linear-gradient(135deg, #050505, #111, #000);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: 25px;
      letter-spacing: 3px;
      font-weight: 800;
    }

    .brand p {
      margin-top: 8px;
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .login-box {
      background: rgba(20,20,20,.82);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 25px;
      padding: 30px 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 80px rgba(0,0,0,.65);
    }

    .login-box h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 7px;
      letter-spacing: 1px;
    }

    .field input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }

    .otp-btn {
      border: none;
      background: white;
      color: black;
    }

    .verify-btn {
      border: none;
      background: #00d9ff;
      color: black;
    }

    .back-btn {
      border: 1px solid #333;
      background: transparent;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      text-align: center;
      min-height: 20px;
      margin-top: 18px;
      color: #aaa;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .bg-text {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
      font-size: clamp(70px, 18vw, 190px);
      font-weight: 900;
      white-space: nowrap;
      color: rgba(255,255,255,.025);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
  </style>
</head>

<body>

  <div class="bg-text">
    LAXMI NARASHMA
  </div>

  <div class="container">

    <div class="brand">
      <h1>LAXMI NARASHMA</h1>
      <p>MOBILE SHOP</p>
    </div>

    <div class="login-box">

      <!-- EMAIL STEP -->

      <div id="emailStep">

        <h2>Welcome</h2>

        <div class="subtitle">
          Enter your email to receive OTP
        </div>

        <div class="field">

          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>

        <button
          type="button"
          class="otp-btn"
          id="sendOtpBtn"
        >
          SEND OTP
        </button>

      </div>


      <!-- OTP STEP -->

      <div
        id="otpStep"
        class="hidden"
      >

        <h2>Verify OTP</h2>

        <div class="subtitle">
          Enter the OTP sent to your email
        </div>

        <div class="field">

          <label>OTP</label>

          <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            inputmode="numeric"
            maxlength="6"
          >

        </div>

        <button
          type="button"
          class="verify-btn"
          id="verifyOtpBtn"
        >
          VERIFY OTP
        </button>

        <button
          type="button"
          class="back-btn"
          id="backBtn"
        >
          CHANGE EMAIL
        </button>

      </div>


      <div id="message"></div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://antkerjfmdmyitiehnty.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_gzORKzM9wqsWqUjlp0fq6g_MHjyz4Bs";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const emailStep =
      document.getElementById("emailStep");

    const otpStep =
      document.getElementById("otpStep");

    const emailInput =
      document.getElementById("email");

    const otpInput =
      document.getElementById("otp");

    const sendOtpBtn =
      document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
      document.getElementById("verifyOtpBtn");

    const backBtn =
      document.getElementById("backBtn");

    const message =
      document.getElementById("message");


    /* SEND OTP */

    sendOtpBtn.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();


        if (!email) {

          message.textContent =
            "Enter your email.";

          return;
        }


        message.textContent =
          "Sending OTP...";


        const { error } =
          await supabaseClient.auth
            .signInWithOtp({

              email: email,

              options: {
                shouldCreateUser: true
              }

            });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        message.textContent =
          "OTP sent. Check your email.";


        emailStep.classList.add("hidden");

        otpStep.classList.remove("hidden");

        otpInput.focus();

      }
    );


    /* VERIFY OTP */

    verifyOtpBtn.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();

        const token =
          otpInput.value.trim();


        if (!token) {

          message.textContent =
            "Enter the OTP.";

          return;
        }


        message.textContent =
          "Verifying OTP...";


        const { error } =
          await supabaseClient.auth
            .verifyOtp({

              email: email,

              token: token,

              type: "email"

            });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        message.textContent =
          "Login successful...";


        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 500);

      }
    );


    /* CHANGE EMAIL */

    backBtn.addEventListener(
      "click",
      function() {

        otpInput.value = "";

        message.textContent = "";

        otpStep.classList.add("hidden");

        emailStep.classList.remove("hidden");

        emailInput.focus();

      }
    );

  </script>

</body>
</html>
