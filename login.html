<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email OTP Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #020617, #0f172a);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #111827;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      color: white;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 25px;
      color: #38bdf8;
    }

    .logo p {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      margin-top: 10px;
    }

    .secondary:hover {
      background: #1e293b;
    }

    #otpStep {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      color: #38bdf8;
    }

    .otp-info {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .otp-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 24px;
      font-weight: bold;
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>Laxmi Narashma Mobile Shop</h1>
      <p>Mobile Repair & Service</p>
    </div>

    <!-- EMAIL STEP -->
    <div id="emailStep">

      <h2>Email OTP Login</h2>

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <button id="sendOtpBtn">
        SEND OTP
      </button>

    </div>


    <!-- OTP STEP -->
    <div id="otpStep">

      <h2>Enter OTP</h2>

      <div class="otp-info">
        We sent a 6-digit OTP to<br>
        <strong id="emailDisplay"></strong>
      </div>

      <label for="otp">6-Digit OTP</label>

      <input
        type="text"
        id="otp"
        class="otp-input"
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <button id="verifyOtpBtn">
        VERIFY OTP
      </button>

      <button id="resendOtpBtn" class="secondary">
        RESEND OTP
      </button>

      <button id="changeEmailBtn" class="secondary">
        CHANGE EMAIL
      </button>

    </div>

    <div id="message" class="message"></div>

    <div class="back-link">
      Secure login powered by Supabase
    </div>

  </div>


  <script>

    /* ================================
       SUPABASE
    ================================= */

    const SUPABASE_URL =
      "https://antkerjfmdmyitiehnty.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_gzORKzM9wqsWqUjlp0fq6g_MHjyz4Bs";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ================================
       ELEMENTS
    ================================= */

    const emailStep =
      document.getElementById("emailStep");

    const otpStep =
      document.getElementById("otpStep");

    const emailInput =
      document.getElementById("email");

    const otpInput =
      document.getElementById("otp");

    const emailDisplay =
      document.getElementById("emailDisplay");

    const sendOtpBtn =
      document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
      document.getElementById("verifyOtpBtn");

    const resendOtpBtn =
      document.getElementById("resendOtpBtn");

    const changeEmailBtn =
      document.getElementById("changeEmailBtn");

    const message =
      document.getElementById("message");


    let currentEmail = "";

    let resendTimer = null;

    let secondsLeft = 0;


    /* ================================
       MESSAGE
    ================================= */

    function showMessage(text, success = false) {

      message.textContent = text;

      message.style.color =
        success ? "#22c55e" : "#38bdf8";
    }


    /* ================================
       SEND OTP
    ================================= */

    async function sendOTP() {

      const email =
        emailInput.value.trim();

      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return;
      }

      if (!email.includes("@")) {

        showMessage(
          "Please enter a valid email."
        );

        return;
      }


      sendOtpBtn.disabled = true;

      sendOtpBtn.textContent =
        "SENDING...";

      showMessage(
        "Sending OTP..."
      );


      try {

        const { error } =
          await supabaseClient.auth.signInWithOtp({

            email: email,

            options: {
              shouldCreateUser: true
            }

          });


        if (error) {

          console.error(error);

          showMessage(
            "OTP send failed: " +
            error.message
          );

          sendOtpBtn.disabled = false;

          sendOtpBtn.textContent =
            "SEND OTP";

          return;
        }


        currentEmail = email;

        emailDisplay.textContent =
          email;

        emailStep.style.display =
          "none";

        otpStep.style.display =
          "block";

        otpInput.value = "";

        otpInput.focus();

        showMessage(
          "OTP sent successfully."
        );

        startResendTimer();

      }

      catch (error) {

        console.error(error);

        showMessage(
          "Something went wrong."
        );

        sendOtpBtn.disabled = false;

        sendOtpBtn.textContent =
          "SEND OTP";
      }
    }


    /* ================================
       VERIFY OTP
    ================================= */

    async function verifyOTP() {

      const otp =
        otpInput.value.trim();


      if (!/^\d{6}$/.test(otp)) {

        showMessage(
          "Please enter the 6-digit OTP."
        );

        return;
      }


      verifyOtpBtn.disabled = true;

      verifyOtpBtn.textContent =
        "VERIFYING...";


      showMessage(
        "Verifying OTP..."
      );


      try {

        const { data, error } =
          await supabaseClient.auth.verifyOtp({

            email: currentEmail,

            token: otp,

            type: "email"

          });


        if (error) {

          console.error(error);

          showMessage(
            "Invalid OTP: " +
            error.message
          );

          verifyOtpBtn.disabled = false;

          verifyOtpBtn.textContent =
            "VERIFY OTP";

          return;
        }


        if (data.session) {

          showMessage(
            "Login successful!",
            true
          );


          setTimeout(function () {

            window.location.href =
              "index.html";

          }, 1000);

        }

      }

      catch (error) {

        console.error(error);

        showMessage(
          "Verification failed."
        );

        verifyOtpBtn.disabled = false;

        verifyOtpBtn.textContent =
          "VERIFY OTP";
      }
    }


    /* ================================
       RESEND TIMER
    ================================= */

    function startResendTimer() {

      clearInterval(resendTimer);

      secondsLeft = 60;

      resendOtpBtn.disabled = true;

      resendOtpBtn.textContent =
        "RESEND OTP (" +
        secondsLeft +
        "s)";


      resendTimer =
        setInterval(function () {

          secondsLeft--;

          if (secondsLeft <= 0) {

            clearInterval(resendTimer);

            resendOtpBtn.disabled =
              false;

            resendOtpBtn.textContent =
              "RESEND OTP";

            return;
          }


          resendOtpBtn.textContent =
            "RESEND OTP (" +
            secondsLeft +
            "s)";

        }, 1000);
    }


    /* ================================
       RESEND OTP
    ================================= */

    async function resendOTP() {

      if (!currentEmail) {
        return;
      }


      resendOtpBtn.disabled = true;

      resendOtpBtn.textContent =
        "SENDING...";


      try {

        const { error } =
          await supabaseClient.auth.signInWithOtp({

            email: currentEmail,

            options: {
              shouldCreateUser: true
            }

          });


        if (error) {

          console.error(error);

          showMessage(
            "Resend failed: " +
            error.message
          );

          startResendTimer();

          return;
        }


        showMessage(
          "New OTP sent successfully."
        );

        otpInput.value = "";

        otpInput.focus();

        startResendTimer();

      }

      catch (error) {

        console.error(error);

        showMessage(
          "Resend failed."
        );

        startResendTimer();
      }
    }


    /* ================================
       CHANGE EMAIL
    ================================= */

    function changeEmail() {

      clearInterval(resendTimer);

      currentEmail = "";

      otpInput.value = "";

      emailInput.value = "";

      otpStep.style.display =
        "none";

      emailStep.style.display =
        "block";

      sendOtpBtn.disabled =
        false;

      sendOtpBtn.textContent =
        "SEND OTP";

      showMessage(
        ""
      );

      emailInput.focus();
    }


    /* ================================
       BUTTON EVENTS
    ================================= */

    sendOtpBtn.addEventListener(
      "click",
      sendOTP
    );

    verifyOtpBtn.addEventListener(
      "click",
      verifyOTP
    );

    resendOtpBtn.addEventListener(
      "click",
      resendOTP
    );

    changeEmailBtn.addEventListener(
      "click",
      changeEmail
    );


    /* ================================
       ENTER KEY
    ================================= */

    emailInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendOTP();
        }

      }
    );


    otpInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          verifyOTP();
        }

      }
    );


    /* ================================
       OTP ONLY NUMBERS
    ================================= */

    otpInput.addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 6);

      }
    );

  </script>

</body>
</html>>
