<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Narashma Mobile Shop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  overflow:hidden;
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#252525 0,#0b0b0b 40%,#000 75%);
}

/* BIG BACKGROUND NAME */
.ghost{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(55px,12vw,180px);
  font-weight:900;
  letter-spacing:-7px;
  white-space:nowrap;
  color:rgba(255,255,255,.035);
}

/* HEADER */
.brand{
  position:absolute;
  top:25px;
  left:28px;
  z-index:50;
  font-size:14px;
  font-weight:800;
  letter-spacing:2px;
}

.brand small{
  display:block;
  margin-top:5px;
  color:#888;
  font-size:9px;
  letter-spacing:3px;
}

.logout{
  position:absolute;
  top:22px;
  right:25px;
  z-index:50;
  padding:10px 17px;
  border-radius:25px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  cursor:pointer;
}

/* STAGE */
.stage{
  position:absolute;
  width:100%;
  height:620px;
  top:52%;
  left:50%;
  transform:translate(-50%,-50%);
  perspective:1300px;
}

/* 3D PHONE */
.phone{
  position:absolute;
  width:230px;
  height:470px;
  left:50%;
  top:50%;
  transform-style:preserve-3d;
  transition:
    transform .7s cubic-bezier(.2,.8,.2,1),
    opacity .7s ease,
    filter .7s ease;
  cursor:pointer;
}

/* PHONE OUTER BODY */
.phone-body{
  position:absolute;
  inset:0;
  border-radius:38px;
  background:
    linear-gradient(
      135deg,
      #777 0%,
      #202020 8%,
      #050505 45%,
      #333 75%,
      #888 100%
    );
  padding:7px;
  box-shadow:
    0 35px 90px rgba(0,0,0,.9),
    inset 0 0 15px rgba(255,255,255,.3);
  transform:translateZ(0);
}

/* SCREEN */
.screen{
  position:relative;
  width:100%;
  height:100%;
  border-radius:32px;
  overflow:hidden;
  background:
    radial-gradient(circle at 65% 20%,#4b4b4b,#171717 35%,#020202 80%);
  border:1px solid #555;
}

/* SCREEN GLOW */
.screen::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.25),
      transparent 20%,
      transparent 60%,
      rgba(255,255,255,.05)
    );
  pointer-events:none;
}

/* DYNAMIC ISLAND / CAMERA */
.camera{
  position:absolute;
  top:13px;
  left:50%;
  transform:translateX(-50%);
  width:72px;
  height:22px;
  border-radius:20px;
  background:#000;
  box-shadow:inset 0 1px 5px #333;
  z-index:5;
}

/* WALLPAPER */
.wallpaper{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
  color:rgba(255,255,255,.12);
}

/* PHONE INFO */
.info{
  position:absolute;
  left:22px;
  bottom:25px;
  z-index:8;
  text-shadow:0 2px 10px #000;
}

.info .maker{
  color:#aaa;
  font-size:9px;
  letter-spacing:3px;
}

.info .model{
  margin-top:6px;
  font-size:21px;
  font-weight:800;
}

/* CAMERA BUMP - SIDE/REALISTIC VISUAL */
.camera-bump{
  position:absolute;
  top:22px;
  left:18px;
  width:82px;
  height:110px;
  border-radius:25px;
  background:
    linear-gradient(145deg,#3c3c3c,#080808);
  box-shadow:
    inset 2px 2px 8px rgba(255,255,255,.15),
    0 8px 18px rgba(0,0,0,.7);
  z-index:20;
  transform:translateZ(12px);
}

.lens{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#777,#111 35%,#000 65%);
  border:2px solid #555;
  box-shadow:inset 0 0 7px #000;
}

.l1{top:12px;left:12px}
.l2{top:12px;right:12px}
.l3{bottom:12px;left:12px}

.flash{
  position:absolute;
  right:13px;
  bottom:18px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#ddd;
  box-shadow:0 0 8px #fff;
}

/* POSITIONS */
.center{
  transform:
    translate(-50%,-50%)
    rotateY(0deg)
    rotateX(2deg)
    translateZ(120px)
    scale(1.04);
  opacity:1;
  z-index:10;
}

.right{
  transform:
    translate(calc(-50% + 285px),-50%)
    rotateY(-32deg)
    rotateZ(4deg)
    translateZ(-80px)
    scale(.72);
  opacity:.58;
  filter:brightness(.65);
  z-index:6;
}

.left{
  transform:
    translate(calc(-50% - 285px),-50%)
    rotateY(32deg)
    rotateZ(-4deg)
    translateZ(-80px)
    scale(.72);
  opacity:.58;
  filter:brightness(.65);
  z-index:6;
}

.back-right{
  transform:
    translate(calc(-50% + 485px),-50%)
    rotateY(-48deg)
    translateZ(-230px)
    scale(.5);
  opacity:.18;
  filter:brightness(.3) blur(2px);
}

.back-left{
  transform:
    translate(calc(-50% - 485px),-50%)
    rotateY(48deg)
    translateZ(-230px)
    scale(.5);
  opacity:.18;
  filter:brightness(.3) blur(2px);
}

.hidden{
  transform:
    translate(-50%,-50%)
    translateZ(-500px)
    scale(.2);
  opacity:0;
}

/* ARROWS */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  z-index:40;
}

.arrow:hover{
  background:#fff;
  color:#000;
}

.prev{left:25px}
.next{right:25px}

/* AI PANEL */
.panel{
  position:absolute;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  width:min(440px,90vw);
  padding:16px;
  border:1px solid #333;
  border-radius:20px;
  background:rgba(5,5,5,.9);
  backdrop-filter:blur(18px);
  z-index:45;
  display:none;
}

.panel.show{display:block}

.panel-title{
  color:#999;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.problems{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.problem{
  padding:11px;
  border-radius:11px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.problem:hover{
  background:#fff;
  color:#000;
}

/* BOTTOM */
.bottom{
  position:absolute;
  left:28px;
  bottom:25px;
  z-index:30;
}

.bottom small{
  color:#777;
  letter-spacing:3px;
}

.bottom h2{
  margin-top:6px;
  font-size:17px;
  letter-spacing:2px;
}

.discover{
  position:absolute;
  right:28px;
  bottom:30px;
  z-index:30;
  color:#aaa;
  font-size:11px;
  letter-spacing:2px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){

  .stage{
    height:530px;
  }

  .phone{
    width:195px;
    height:400px;
  }

  .center{
    transform:
      translate(-50%,-50%)
      rotateY(0deg)
      translateZ(70px)
      scale(.94);
  }

  .right{
    transform:
      translate(calc(-50% + 155px),-50%)
      rotateY(-27deg)
      translateZ(-70px)
      scale(.62);
  }

  .left{
    transform:
      translate(calc(-50% - 155px),-50%)
      rotateY(27deg)
      translateZ(-70px)
      scale(.62);
  }

  .back-right{
    transform:
      translate(calc(-50% + 270px),-50%)
      rotateY(-40deg)
      translateZ(-150px)
      scale(.42);
  }

  .back-left{
    transform:
      translate(calc(-50% - 270px),-50%)
      rotateY(40deg)
      translateZ(-150px)
      scale(.42);
  }

  .arrow{
    width:44px;
    height:44px;
  }

  .prev{left:8px}
  .next{right:8px}

  .brand{
    left:18px;
    top:18px;
  }

  .logout{
    right:18px;
    top:16px;
  }
}
</style>
</head>

<body>

<div class="page">

<div class="ghost">LAXMI NARASHMA</div>

<div class="brand">
  LAXMI NARASHMA
  <small>MOBILE SHOP</small>
</div>

<button class="logout" onclick="logoutUser()">Logout</button>

<div class="stage">

<!-- PHONE 1 -->
<div class="phone center"
     data-brand="NOTHING"
     data-model="Phone (2)"
     onclick="selectPhone(this)">

  <div class="phone-body">

    <div class="camera-bump">
      <div class="lens l1"></div>
      <div class="lens l2"></div>
      <div class="lens l3"></div>
      <div class="flash"></div>
    </div>

    <div class="screen">
      <div class="camera"></div>

      <div class="wallpaper">
        NOTHING
      </div>

      <div class="info">
        <div class="maker">NOTHING</div>
        <div class="model">Phone (2)</div>
      </div>
    </div>

  </div>
</div>

<!-- PHONE 2 -->
<div class="phone right"
     data-brand="APPLE"
     data-model="iPhone 15"
     onclick="selectPhone(this)">

  <div class="phone-body">

    <div class="camera-bump">
      <div class="lens l1"></div>
      <div class="lens l2"></div>
      <div class="lens l3"></div>
      <div class="flash"></div>
    </div>

    <div class="screen">
      <div class="camera"></div>

      <div class="wallpaper">
        APPLE
      </div>

      <div class="info">
        <div class="maker">APPLE</div>
        <div class="model">iPhone 15</div>
      </div>
    </div>

  </div>
</div>

<!-- PHONE 3 -->
<div class="phone back-right"
     data-brand="SAMSUNG"
     data-model="Galaxy S24"
     onclick="selectPhone(this)">

  <div class="phone-body">

    <div class="camera-bump">
      <div class="lens l1"></div>
      <div class="lens l2"></div>
      <div class="lens l3"></div>
      <div class="flash"></div>
    </div>

    <div class="screen">
      <div class="camera"></div>

      <div class="wallpaper">
        SAMSUNG
      </div>

      <div class="info">
        <div class="maker">SAMSUNG</div>
        <div class="model">Galaxy S24</div>
      </div>
    </div>

  </div>
</div>

<!-- PHONE 4 -->
<div class="phone left"
     data-brand="ONEPLUS"
     data-model="12"
     onclick="selectPhone(this)">

  <div class="phone-body">

    <div class="camera-bump">
      <div class="lens l1"></div>
      <div class="lens l2"></div>
      <div class="lens l3"></div>
      <div class="flash"></div>
    </div>

    <div class="screen">
      <div class="camera"></div>

      <div class="wallpaper">
        ONEPLUS
      </div>

      <div class="info">
        <div class="maker">ONEPLUS</div>
        <div class="model">12</div>
      </div>
    </div>

  </div>
</div>

<!-- PHONE 5 -->
<div class="phone back-left"
     data-brand="VIVO"
     data-model="V30"
     onclick="selectPhone(this)">

  <div class="phone-body">

    <div class="camera-bump">
      <div class="lens l1"></div>
      <div class="lens l2"></div>
      <div class="lens l3"></div>
      <div class="flash"></div>
    </div>

    <div class="screen">
      <div class="camera"></div>

      <div class="wallpaper">
        VIVO
      </div>

      <div class="info">
        <div class="maker">VIVO</div>
        <div class="model">V30</div>
      </div>
    </div>

  </div>
</div>

</div>

<button class="arrow prev" onclick="previousPhone()">‹</button>
<button class="arrow next" onclick="nextPhone()">›</button>

<div class="panel" id="panel">

<div class="panel-title" id="selected">
AI MOBILE DIAGNOSTIC
</div>

<div class="problems">

<button class="problem" onclick="repair('Screen Damage')">
📱 Screen Damage
</button>

<button class="problem" onclick="repair('Battery Problem')">
🔋 Battery Problem
</button>

<button class="problem" onclick="repair('Charging Problem')">
⚡ Charging Problem
</button>

<button class="problem" onclick="repair('Camera Problem')">
📷 Camera Problem
</button>

<button class="problem" onclick="repair('Software Problem')">
⚙️ Software Problem
</button>

<button class="problem" onclick="repair('Other Problem')">
🛠 Other Problem
</button>

</div>
</div>

<div class="bottom">
<small>SMART SERVICE</small>
<h2>MOBILE AI ASSISTANT</h2>
</div>

<div class="discover" onclick="nextPhone()">
DISCOVER MODELS →
</div>

</div>

<script>

const phones=[
  ...document.querySelectorAll(".phone")
];

let current=0;

function update(){

  phones.forEach((phone,index)=>{

    phone.classList.remove(
      "center",
      "right",
      "left",
      "back-right",
      "back-left",
      "hidden"
    );

    const position=
      (index-current+phones.length)%phones.length;

    if(position===0){
      phone.classList.add("center");
    }
    else if(position===1){
      phone.classList.add("right");
    }
    else if(position===2){
      phone.classList.add("back-right");
    }
    else if(position===phones.length-1){
      phone.classList.add("left");
    }
    else if(position===phones.length-2){
      phone.classList.add("back-left");
    }
    else{
      phone.classList.add("hidden");
    }

  });

  updateTitle();
}

function nextPhone(){

  current=
    (current+1)%phones.length;

  update();
}

function previousPhone(){

  current=
    (current-1+phones.length)%phones.length;

  update();
}

function selectPhone(phone){

  const index=phones.indexOf(phone);

  if(index<0)return;

  current=index;

  update();

  document
    .getElementById("panel")
    .classList.add("show");
}

function updateTitle(){

  const phone=phones[current];

  document.getElementById("selected").textContent=
    phone.dataset.brand+
    " • "+
    phone.dataset.model+
    " — AI DIAGNOSTIC";
}

function repair(problem){

  const phone=phones[current];

  alert(
    "LAXMI NARASHMA MOBILE SHOP\n\n"+
    "Brand: "+phone.dataset.brand+"\n"+
    "Model: "+phone.dataset.model+"\n\n"+
    "Problem: "+problem
  );
}

function logoutUser(){

  if(
    typeof supabaseClient!=="undefined" &&
    supabaseClient.auth
  ){

    supabaseClient.auth.signOut()
    .then(()=>{
      window.location.href="login.html";
    });

  }else{

    window.location.href="login.html";

  }
}

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowRight"){
    nextPhone();
  }

  if(e.key==="ArrowLeft"){
    previousPhone();
  }

});

update();

</script>

</body>
</html>
