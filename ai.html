<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile AI Assistant | Laxmi Narashma</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #292929 0%, #0b0b0b 42%, #020202 100%);
    }

    /* BIG WEBSITE NAME BEHIND PHONES */

    .ghost-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 100%;
      text-align: center;

      font-size: clamp(55px, 13vw, 180px);
      font-weight: 900;
      letter-spacing: -7px;

      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.08);

      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    /* TOP BRAND */

    .brand {
      position: absolute;
      top: 25px;
      left: 30px;
      z-index: 100;
    }

    .brand small {
      display: block;
      color: #777;
      font-size: 9px;
      letter-spacing: 4px;
      margin-bottom: 5px;
    }

    .brand strong {
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* LOGOUT */

    .logout {
      position: absolute;
      top: 20px;
      right: 25px;
      z-index: 100;

      padding: 10px 17px;

      border: 1px solid #333;
      border-radius: 20px;

      background: rgba(0,0,0,.5);
      color: #aaa;

      cursor: pointer;
    }

    .logout:hover {
      color: white;
      border-color: #777;
    }

    /* CAROUSEL */

    .carousel {
      position: absolute;
      inset: 0;
    }

    .phone {
      position: absolute;

      left: 50%;
      bottom: 5%;

      width: 220px;
      height: 450px;

      border-radius: 40px;

      background: linear-gradient(145deg, #303030, #050505);

      border: 2px solid rgba(255,255,255,.18);

      overflow: hidden;

      box-shadow: 0 40px 100px rgba(0,0,0,.8);

      cursor: pointer;

      transition:
        left .65s cubic-bezier(.4,0,.2,1),
        transform .65s cubic-bezier(.4,0,.2,1),
        opacity .65s cubic-bezier(.4,0,.2,1),
        filter .65s cubic-bezier(.4,0,.2,1);
    }

    .screen {
      position: absolute;
      inset: 7px;

      border-radius: 34px;

      background:
        radial-gradient(circle at 50% 25%, #555, transparent 20%),
        linear-gradient(145deg,#202020,#020202);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at 30% 70%, rgba(255,255,255,.08), transparent 25%);
    }

    .notch {
      position: absolute;
      top: 12px;
      left: 50%;

      transform: translateX(-50%);

      width: 75px;
      height: 17px;

      background: #000;
      border-radius: 20px;

      z-index: 5;
    }

    .logo {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: 52px;
      font-weight: 900;

      color: rgba(255,255,255,.15);

      z-index: 5;
    }

    .phone-name {
      position: absolute;

      bottom: 28px;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 16px;
      font-weight: bold;

      z-index: 6;
    }

    /* PHONE POSITIONS */

    .center {
      left: 50%;

      transform:
        translateX(-50%)
        scale(1.35);

      opacity: 1;
      filter: none;

      z-index: 20;
    }

    .left {
      left: 22%;

      transform:
        translateX(-50%)
        scale(.7);

      opacity: .75;
      filter: blur(2px);

      z-index: 10;
    }

    .right {
      left: 78%;

      transform:
        translateX(-50%)
        scale(.7);

      opacity: .75;
      filter: blur(2px);

      z-index: 10;
    }

    .back {
      left: 50%;

      transform:
        translateX(-50%)
        scale(.55);

      opacity: .25;
      filter: blur(6px);

      z-index: 5;
    }

    /* AI PANEL */

    .ai-panel {
      position: absolute;

      top: 90px;
      right: 25px;

      width: 280px;

      padding: 20px;

      background: rgba(5,5,5,.72);

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 18px;

      backdrop-filter: blur(20px);

      z-index: 100;
    }

    .ai-panel h2 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .ai-panel p {
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .issue {
      display: block;

      width: 100%;

      margin-top: 7px;

      padding: 10px;

      border: 1px solid #292929;
      border-radius: 9px;

      background: #101010;
      color: white;

      text-align: left;

      cursor: pointer;
    }

    .issue:hover {
      background: #222;
    }

    /* BOTTOM */

    .bottom {
      position: absolute;

      left: 30px;
      bottom: 28px;

      z-index: 100;
    }

    .bottom small {
      color: #777;
      font-size: 9px;
      letter-spacing: 4px;
    }

    .bottom h1 {
      font-size: 22px;
      margin-top: 6px;
    }

    .model {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    /* ARROWS */

    .controls {
      position: absolute;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      display: flex;
      gap: 10px;

      z-index: 100;
    }

    .arrow {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 1px solid #444;

      background: rgba(0,0,0,.55);

      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    .arrow:hover {
      background: white;
      color: black;
    }

    .discover {
      position: absolute;

      right: 30px;
      bottom: 32px;

      color: #888;

      font-size: 11px;
      letter-spacing: 2px;

      z-index: 100;
    }

    /* MOBILE */

    @media(max-width:700px) {

      .brand {
        left: 15px;
        top: 17px;
      }

      .brand strong {
        font-size: 13px;
      }

      .logout {
        right: 15px;
        top: 15px;
      }

      .ghost-name {
        font-size: 55px;
        letter-spacing: -3px;
      }

      .phone {
        width: 150px;
        height: 310px;
        border-radius: 28px;
      }

      .screen {
        border-radius: 22px;
      }

      .center {
        transform:
          translateX(-50%)
          scale(1.15);
      }

      .left {
        left: 13%;
        transform:
          translateX(-50%)
          scale(.55);
      }

      .right {
        left: 87%;
        transform:
          translateX(-50%)
          scale(.55);
      }

      .back {
        transform:
          translateX(-50%)
          scale(.45);
      }

      .ai-panel {
        left: 15px;
        right: 15px;
        top: auto;
        bottom: 85px;
        width: auto;
      }

      .bottom {
        left: 15px;
        bottom: 18px;
      }

      .bottom h1 {
        font-size: 15px;
      }

      .discover {
        display: none;
      }
    }
  </style>

    <div class="ghost-name">

  <script>

    const phones = [
      {
        brand: "NOTHING",
        model: "Nothing Phone",
        logo: "N"
      },

      {
        brand: "IPHONE",
        model: "Apple iPhone",
        logo: ""
      },

      {
        brand: "SAMSUNG",
        model: "Samsung Galaxy",
        logo: "S"
      },

      {
        brand: "ONEPLUS",
        model: "OnePlus",
        logo: "+"
      },

      {
        brand: "VIVO",
        model: "Vivo",
        logo: "V"
      },

      {
        brand: "OPPO",
        model: "Oppo",
        logo: "O"
      },

      {
        brand: "REALME",
        model: "Realme",
        logo: "R"
      },

      {
        brand: "REDMI",
        model: "Redmi",
        logo: "R"
      }
    ];

    let active = 0;
    let moving = false;

    const carousel =
      document.getElementById("carousel");

    function createPhones() {

      carousel.innerHTML = "";

      phones.forEach((phone, index) => {

        const element =
          document.createElement("div");

        element.className = "phone";

        element.innerHTML = `
          <div class="screen">

            <div class="notch"></div>

            <div class="logo">
              ${phone.logo}
            </div>

            <div class="phone-name">
              ${phone.brand}
            </div>

          </div>
        `;

        element.onclick = function() {

          active = index;

          renderPhones();

        };

        carousel.appendChild(element);

      });

      renderPhones();
    }

    function renderPhones() {

      const elements =
        document.querySelectorAll(".phone");

      elements.forEach((element, index) => {

        element.className = "phone";

        let position =
          (index - active + phones.length)
          % phones.length;

        if (position === 0) {

          element.classList.add("center");

        } else if (position === 1) {

          element.classList.add("right");

        } else if (
          position === phones.length - 1
        ) {

          element.classList.add("left");

        } else {

          element.classList.add("back");

        }

      });

      document.getElementById("selectedBrand")
        .textContent =
        phones[active].brand;

      document.getElementById("selectedModel")
        .textContent =
        phones[active].model;

      document.getElementById("aiMessage")
        .textContent =
        "Selected " +
        phones[active].model +
        ". Choose your problem.";
    }

    function nextPhone() {

      if (moving) return;

      moving = true;

      active =
        (active + 1) % phones.length;

      renderPhones();

      setTimeout(() => {
        moving = false;
      }, 650);
    }

    function previousPhone() {

      if (moving) return;

      moving = true;

      active =
        (active - 1 + phones.length)
        % phones.length;

      renderPhones();

      setTimeout(() => {
        moving = false;
      }, 650);
    }

    function selectProblem(problem) {

      const phone =
        phones[active];

      document.getElementById("aiMessage")
        .innerHTML =
        "<strong>" +
        phone.model +
        "</strong><br><br>" +
        problem +
        " selected.<br><br>" +
        "AI diagnosis ready.";
    }

    async function logout() {

      /*
        script.js creates supabaseClient.
      */

      if (
        typeof supabaseClient !== "undefined"
      ) {

        await supabaseClient.auth.signOut();

      }

      window.location.href =
        "login.html";
    }

    createPhones();

  </script>
