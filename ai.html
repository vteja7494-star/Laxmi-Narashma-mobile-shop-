<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Narashma Mobile Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  background:#020202;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#202020 0%,#080808 42%,#000 80%);
}

/* BACKGROUND */
.ghost{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(50px,12vw,170px);
  font-weight:900;
  letter-spacing:-7px;
  white-space:nowrap;
  color:rgba(255,255,255,.035);
}

/* HEADER */
.brand{
  position:absolute;
  top:24px;
  left:28px;
  z-index:100;
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
}

.brand small{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:9px;
  letter-spacing:3px;
}

.logout{
  position:absolute;
  top:20px;
  right:24px;
  z-index:100;
  padding:10px 18px;
  border:1px solid #444;
  border-radius:25px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

/* 3D STAGE */
.stage{
  position:absolute;
  width:100%;
  height:620px;
  top:52%;
  left:50%;
  transform:translate(-50%,-50%);
  perspective:1400px;
}

/* PHONE */
.phone{
  position:absolute;
  width:235px;
  height:475px;
  left:50%;
  top:50%;
  transform-style:preserve-3d;
  transition:
    transform .75s cubic-bezier(.2,.8,.2,1),
    opacity .75s,
    filter .75s;
  cursor:pointer;
}

/* BODY */
.phone-body{
  position:absolute;
  inset:0;
  padding:7px;
  border-radius:40px;
  box-shadow:
    0 35px 90px rgba(0,0,0,.9),
    inset 0 0 12px rgba(255,255,255,.3);
}

/* DIFFERENT PHONE COLORS */
.nothing .phone-body{
  background:linear-gradient(145deg,#d8d8d8,#555,#eeeeee);
}

.apple .phone-body{
  background:linear-gradient(145deg,#6f86a8,#d8e4ef,#526b89);
}

.samsung .phone-body{
  background:linear-gradient(145deg,#2b3550,#111827,#53627c);
}

.oneplus .phone-body{
  background:linear-gradient(145deg,#8c3030,#240606,#b84b4b);
}

.vivo .phone-body{
  background:linear-gradient(145deg,#d7d1bd,#6c6657,#e8e0c7);
}

/* SCREEN */
.screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:34px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:
    inset 0 0 25px rgba(0,0,0,.7);
}

/* SCREEN COLORS */
.nothing .screen{
  background:
    radial-gradient(circle at 30% 20%,#ffffff,#777 18%,#181818 55%,#000);
}

.apple .screen{
  background:
    radial-gradient(circle at 70% 25%,#9ed7ff,#24547b 30%,#050b14 75%);
}

.samsung .screen{
  background:
    radial-gradient(circle at 35% 25%,#b4d7ff,#345a91 30%,#02050a 78%);
}

.oneplus .screen{
  background:
    radial-gradient(circle at 70% 20%,#ff5a48,#5d1010 30%,#050000 75%);
}

.vivo .screen{
  background:
    radial-gradient(circle at 25% 20%,#ffe9a6,#7c5d28 30%,#080705 75%);
}

/* GLASS */
.screen::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.3),
      transparent 20%,
      transparent 65%,
      rgba(255,255,255,.08)
    );
  pointer-events:none;
}

/* TOP CAMERA */
.camera{
  position:absolute;
  top:13px;
  left:50%;
  transform:translateX(-50%);
  width:70px;
  height:22px;
  border-radius:20px;
  background:#000;
  box-shadow:inset 0 1px 5px #555;
  z-index:10;
}

/* PHONE WALLPAPER */
.wallpaper{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
  opacity:.25;
}

/* CAMERA BUMP */
.camera-bump{
  position:absolute;
  top:20px;
  left:18px;
  width:88px;
  height:115px;
  border-radius:26px;
  background:linear-gradient(145deg,#444,#050505);
  box-shadow:
    inset 2px 2px 10px rgba(255,255,255,.18),
    0 8px 20px rgba(0,0,0,.8);
  z-index:20;
  transform:translateZ(14px);
}

/* LENSES */
.lens{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #9bc4ff 0,
      #20344f 20%,
      #050505 55%,
      #000 75%
    );
  border:2px solid #666;
  box-shadow:
    inset 0 0 8px #000,
    0 2px 4px #000;
}

.l1{top:12px;left:12px}
.l2{top:12px;right:12px}
.l3{bottom:12px;left:12px}

.flash{
  position:absolute;
  right:14px;
  bottom:20px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 10px white;
}

/* PHONE TEXT */
.info{
  position:absolute;
  left:22px;
  bottom:25px;
  z-index:30;
  text-shadow:0 2px 10px #000;
}

.maker{
  color:#ddd;
  font-size:9px;
  letter-spacing:3px;
}

.model{
  margin-top:6px;
  font-size:21px;
  font-weight:900;
}

/* POSITIONS */
.center{
  transform:
    translate(-50%,-50%)
    rotateY(0deg)
    rotateX(2deg)
    translateZ(120px)
    scale(1.05);
  opacity:1;
  z-index:20;
}

.right{
  transform:
    translate(calc(-50% + 285px),-50%)
    rotateY(-34deg)
    rotateZ(4deg)
    translateZ(-80px)
    scale(.72);
  opacity:.65;
  filter:brightness(.7);
  z-index:10;
}

.left{
  transform:
    translate(calc(-50% - 285px),-50%)
    rotateY(34deg)
    rotateZ(-4deg)
    translateZ(-80px)
    scale(.72);
  opacity:.65;
  filter:brightness(.7);
  z-index:10;
}

.back-right{
  transform:
    translate(calc(-50% + 480px),-50%)
    rotateY(-48deg)
    translateZ(-220px)
    scale(.5);
  opacity:.2;
  filter:brightness(.35) blur(2px);
}

.back-left{
  transform:
    translate(calc(-50% - 480px),-50%)
    rotateY(48deg)
    translateZ(-220px)
    scale(.5);
  opacity:.2;
  filter:brightness(.35) blur(2px);
}

/* ARROWS */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  z-index:80;
}

.arrow:hover{
  background:#fff;
  color:#000;
}

.prev{left:25px}
.next{right:25px}

/* AI PANEL */
.panel{
  position:absolute;
  left:50%;
  bottom:68px;
  transform:translateX(-50%);
  width:min(440px,90vw);
  padding:16px;
  border:1px solid #333;
  border-radius:20px;
  background:rgba(5,5,5,.9);
  backdrop-filter:blur(18px);
  z-index:70;
  display:none;
}

.panel.show{
  display:block;
}

.panel-title{
  color:#999;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.problems{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.problem{
  padding:11px;
  border-radius:11px;
  border:1px solid #333;
  background:#111;
  color:white;
  cursor:pointer;
}

.problem:hover{
  background:white;
  color:black;
}

/* BOTTOM */
.bottom{
  position:absolute;
  left:28px;
  bottom:25px;
  z-index:30;
}

.bottom small{
  color:#777;
  letter-spacing:3px;
}

.bottom h2{
  margin-top:6px;
  font-size:17px;
  letter-spacing:2px;
}

.discover{
  position:absolute;
  right:28px;
  bottom:30px;
  z-index:30;
  color:#aaa;
  font-size:11px;
  letter-spacing:2px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){

  .stage{
    height:520px;
  }

  .phone{
    width:195px;
    height:400px;
  }

  .center{
    transform:
      translate(-50%,-50%)
      rotateY(0deg)
      translateZ(70px)
      scale(.94);
  }

  .right{
    transform:
      translate(calc(-50% + 155px),-50%)
      rotateY(-28deg)
      translateZ(-70px)
      scale(.62);
  }

  .left{
    transform:
      translate(calc(-50% - 155px),-50%)
      rotateY(28deg)
      translateZ(-70px)
      scale(.62);
  }

  .back-right{
    transform:
      translate(calc(-50% + 270px),-50%)
      rotateY(-40deg)
      translateZ(-150px)
      scale(.42);
  }

  .back-left{
    transform:
      translate(calc(-50% - 270px),-50%)
      rotateY(40deg)
      translateZ(-150px)
      scale(.42);
  }

  .arrow{
    width:44px;
    height:44px;
  }

  .prev{left:8px}
  .next{right:8px}

  .brand{
    left:18px;
    top:18px;
  }

  .logout{
    right:18px;
    top:16px;
  }
}
</style>
</head>

<body>

<div class="page">

<div class="ghost">LAXMI NARASHMA</div>

<div class="brand">
LAXMI NARASHMA
<small>MOBILE SHOP</small>
</div>

<button class="logout" onclick="logoutUser()">Logout</button>

<div class="stage">

<!-- NOTHING -->
<div class="phone center nothing"
data-brand="NOTHING"
data-model="Phone (2)"
onclick="selectPhone(this)">

<div class="phone-body">

<div class="camera-bump">
<div class="lens l1"></div>
<div class="lens l2"></div>
<div class="lens l3"></div>
<div class="flash"></div>
</div>

<div class="screen">
<div class="camera"></div>
<div class="wallpaper">NOTHING</div>

<div class="info">
<div class="maker">NOTHING</div>
<div class="model">Phone (2)</div>
</div>
</div>

</div>
</div>

<!-- APPLE -->
<div class="phone right apple"
data-brand="APPLE"
data-model="iPhone 15"
onclick="selectPhone(this)">

<div class="phone-body">

<div class="camera-bump">
<div class="lens l1"></div>
<div class="lens l2"></div>
<div class="lens l3"></div>
<div class="flash"></div>
</div>

<div class="screen">
<div class="camera"></div>
<div class="wallpaper">APPLE</div>

<div class="info">
<div class="maker">APPLE</div>
<div class="model">iPhone 15</div>
</div>
</div>

</div>
</div>

<!-- SAMSUNG -->
<div class="phone back-right samsung"
data-brand="SAMSUNG"
data-model="Galaxy S24"
onclick="selectPhone(this)">

<div class="phone-body">

<div class="camera-bump">
<div class="lens l1"></div>
<div class="lens l2"></div>
<div class="lens l3"></div>
<div class="flash"></div>
</div>

<div class="screen">
<div class="camera"></div>
<div class="wallpaper">SAMSUNG</div>

<div class="info">
<div class="maker">SAMSUNG</div>
<div class="model">Galaxy S24</div>
</div>
</div>

</div>
</div>

<!-- ONEPLUS -->
<div class="phone left oneplus"
data-brand="ONEPLUS"
data-model="12"
onclick="selectPhone(this)">

<div class="phone-body">

<div class="camera-bump">
<div class="lens l1"></div>
<div class="lens l2"></div>
<div class="lens l3"></div>
<div class="flash"></div>
</div>

<div class="screen">
<div class="camera"></div>
<div class="wallpaper">ONEPLUS</div>

<div class="info">
<div class="maker">ONEPLUS</div>
<div class="model">12</div>
</div>
</div>

</div>
</div>

<!-- VIVO -->
<div class="phone back-left vivo"
data-brand="VIVO"
data-model="V30"
onclick="selectPhone(this)">

<div class="phone-body">

<div class="camera-bump">
<div class="lens l1"></div>
<div class="lens l2"></div>
<div class="lens l3"></div>
<div class="flash"></div>
</div>

<div class="screen">
<div class="camera"></div>
<div class="wallpaper">VIVO</div>

<div class="info">
<div class="maker">VIVO</div>
<div class="model">V30</div>
</div>
</div>

</div>
</div>

</div>

<button class="arrow prev" onclick="previousPhone()">‹</button>
<button class="arrow next" onclick="nextPhone()">›</button>

<div class="panel" id="panel">

<div class="panel-title" id="selected">
AI MOBILE DIAGNOSTIC
</div>

<div class="problems">

<button class="problem" onclick="repair('Screen Damage')">
📱 Screen Damage
</button>

<button class="problem" onclick="repair('Battery Problem')">
🔋 Battery Problem
</button>

<button class="problem" onclick="repair('Charging Problem')">
⚡ Charging Problem
</button>

<button class="problem" onclick="repair('Camera Problem')">
📷 Camera Problem
</button>

<button class="problem" onclick="repair('Software Problem')">
⚙️ Software Problem
</button>

<button class="problem" onclick="repair('Other Problem')">
🛠 Other Problem
</button>

</div>
</div>

<div class="bottom">
<small>SMART SERVICE</small>
<h2>MOBILE AI ASSISTANT</h2>
</div>

<div class="discover" onclick="nextPhone()">
DISCOVER MODELS →
</div>

</div>

<script>

const phones=[
  ...document.querySelectorAll(".phone")
];

let current=0;

function update(){

  phones.forEach((phone,index)=>{

    phone.classList.remove(
      "center",
      "right",
      "left",
      "back-right",
      "back-left"
    );

    const position=
      (index-current+phones.length)%phones.length;

    if(position===0){
      phone.classList.add("center");
    }
    else if(position===1){
      phone.classList.add("right");
    }
    else if(position===2){
      phone.classList.add("back-right");
    }
    else if(position===phones.length-1){
      phone.classList.add("left");
    }
    else{
      phone.classList.add("back-left");
    }

  });

  updateTitle();
}

function nextPhone(){

  current=(current+1)%phones.length;

  update();
}

function previousPhone(){

  current=(current-1+phones.length)%phones.length;

  update();
}

function selectPhone(phone){

  const index=phones.indexOf(phone);

  if(index<0)return;

  current=index;

  update();

  document
    .getElementById("panel")
    .classList.add("show");
}

function updateTitle(){

  const phone=phones[current];

  document.getElementById("selected").textContent=
    phone.dataset.brand+
    " • "+
    phone.dataset.model+
    " — AI DIAGNOSTIC";
}

function repair(problem){

  const phone=phones[current];

  alert(
    "LAXMI NARASHMA MOBILE SHOP\n\n"+
    "Brand: "+phone.dataset.brand+"\n"+
    "Model: "+phone.dataset.model+"\n\n"+
    "Problem: "+problem
  );
}

function logoutUser(){

  if(typeof supabaseClient!=="undefined" &&
     supabaseClient.auth){

    supabaseClient.auth.signOut()
    .then(()=>{
      window.location.href="login.html";
    });

  }else{
    window.location.href="login.html";
  }
}

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowRight"){
    nextPhone();
  }

  if(e.key==="ArrowLeft"){
    previousPhone();
  }

});

update();

</script>

</body>
</html>
