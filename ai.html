<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Laxmi Narashma Mobile Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:#000;
}

/* HERO IMAGE */
.hero{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

/* DARK OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.82) 0%,
      rgba(0,0,0,.25) 45%,
      rgba(0,0,0,.65) 100%
    );
}

/* HEADER */
.header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:25px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}

.logo{
  font-size:15px;
  font-weight:900;
  letter-spacing:3px;
}

.logo span{
  display:block;
  margin-top:5px;
  color:#aaa;
  font-size:9px;
  letter-spacing:4px;
}

.logout{
  padding:10px 18px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:25px;
  background:rgba(0,0,0,.45);
  color:#fff;
  cursor:pointer;
}

/* CONTENT */
.content{
  position:absolute;
  left:7%;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  max-width:390px;
}

.tag{
  color:#aaa;
  font-size:11px;
  letter-spacing:4px;
  margin-bottom:15px;
}

h1{
  font-size:clamp(35px,5vw,70px);
  line-height:.95;
  letter-spacing:-3px;
}

h1 span{
  color:#aaa;
}

.description{
  margin-top:20px;
  color:#bbb;
  line-height:1.6;
  font-size:14px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 20px;
  border-radius:25px;
  border:1px solid #555;
  background:#111;
  color:white;
  cursor:pointer;
}

.btn.primary{
  background:white;
  color:black;
}

/* AI PANEL */
.ai-panel{
  display:none;
  position:absolute;
  right:6%;
  bottom:45px;
  width:min(380px,88vw);
  padding:18px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:22px;
  background:rgba(5,5,5,.78);
  backdrop-filter:blur(18px);
  z-index:20;
}

.ai-panel.show{
  display:block;
}

.ai-title{
  font-size:11px;
  color:#999;
  letter-spacing:3px;
  margin-bottom:15px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.option{
  padding:12px;
  border:1px solid #333;
  border-radius:12px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.option:hover{
  background:#fff;
  color:#000;
}

.close{
  position:absolute;
  top:12px;
  right:15px;
  color:#888;
  cursor:pointer;
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:22px;
  left:30px;
  z-index:10;
  color:#777;
  font-size:10px;
  letter-spacing:3px;
}

/* MOBILE */
@media(max-width:700px){

  .hero{
    object-position:62% center;
  }

  .overlay{
    background:
      linear-gradient(
        180deg,
        rgba(0,0,0,.65),
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.9)
      );
  }

  .header{
    padding:18px;
  }

  .content{
    left:20px;
    right:20px;
    top:56%;
    max-width:none;
  }

  h1{
    font-size:43px;
  }

  .description{
    font-size:13px;
  }

  .ai-panel{
    right:5%;
    bottom:25px;
    left:5%;
    width:90%;
  }

  .footer{
    display:none;
  }
}
</style>
</head>

<body>

<div class="page">

<img
  class="hero"
  src="ai-hero.png"
  alt="Laxmi Narashma Mobile Shop AI Mobile Showcase"
>

<div class="overlay"></div>

<header class="header">

<div class="logo">
LAXMI NARASHMA
<span>MOBILE SHOP</span>
</div>

<button class="logout" onclick="logoutUser()">
Logout
</button>

</header>

<section class="content">

<div class="tag">
SMART MOBILE ASSISTANT
</div>

<h1>
Find Your<br>
<span>Perfect Mobile.</span>
</h1>

<p class="description">
Explore latest smartphones, compare models,
check prices and get repair assistance from
Laxmi Narashma Mobile Shop.
</p>

<div class="buttons">

<button class="btn primary" onclick="openAI()">
🤖 AI Assistant
</button>

<button class="btn" onclick="showPhones()">
📱 Explore Phones
</button>

</div>

</section>

<div class="ai-panel" id="aiPanel">

<div class="close" onclick="closeAI()">✕</div>

<div class="ai-title">
LAXMI NARASHMA AI ASSISTANT
</div>

<div class="options">

<button class="option" onclick="aiAction('Compare Phones')">
📱 Compare Phones
</button>

<button class="option" onclick="aiAction('Check Price')">
💰 Check Price
</button>

<button class="option" onclick="aiAction('Find Phone')">
🔎 Find Phone
</button>

<button class="option" onclick="aiAction('Repair Help')">
🛠 Repair Help
</button>

</div>

</div>

<div class="footer">
LATEST PHONES • BEST PRICES • TRUSTED SERVICE
</div>

</div>

<script>

function openAI(){
  document
    .getElementById("aiPanel")
    .classList.add("show");
}

function closeAI(){
  document
    .getElementById("aiPanel")
    .classList.remove("show");
}

function showPhones(){

  alert(
    "LAXMI NARASHMA MOBILE SHOP\n\n"+
    "Available Brands:\n"+
    "Apple\n"+
    "Samsung\n"+
    "OnePlus\n"+
    "Vivo\n"+
    "Nothing"
  );

}

function aiAction(action){

  alert(
    "LAXMI NARASHMA AI\n\n"+
    "Selected: "+action
  );

}

function logoutUser(){

  if(
    typeof supabaseClient!=="undefined" &&
    supabaseClient.auth
  ){

    supabaseClient.auth.signOut()
    .then(()=>{
      window.location.href="login.html";
    });

  }else{

    window.location.href="login.html";

  }

}

</script>

</body>
</html>
