<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laxmi Narashma Mobile Shop</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020305;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  transition:opacity 1s ease;
}

.scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#020305;
}

/* =========================
   SHOWROOM
========================= */

.store{
  position:absolute;
  inset:0;

  background:url("store.png")
    center center /
    cover
    no-repeat;

  transform:scale(1.03);

  filter:brightness(.78);
}

.store::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(0,220,255,.10),
      transparent 42%
    ),
    linear-gradient(
      to bottom,
      rgba(0,0,0,.12),
      rgba(0,0,0,.48)
    );
}

/* =========================
   CENTER CYAN GLOW
========================= */

.glow{
  position:absolute;

  left:50%;
  top:53%;

  width:430px;
  height:430px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,220,255,.30),
      rgba(0,150,220,.12) 38%,
      transparent 72%
    );

  filter:blur(25px);

  opacity:0;

  animation:
    glowIn 1.5s ease .2s
    forwards;
}

@keyframes glowIn{

  to{
    opacity:1;
  }

}

/* =========================
   PHONE
========================= */

.phone{
  position:absolute;

  z-index:10;

  left:50%;
  top:55%;

  width:min(260px,55vw);

  transform:
    translate(-50%,130vh)
    scale(.72);

  opacity:0;

  filter:
    drop-shadow(
      0 30px 40px
      rgba(0,0,0,.85)
    )
    drop-shadow(
      0 0 28px
      rgba(0,220,255,.35)
    );

  animation:
    phoneReveal
    2.3s
    cubic-bezier(.18,.82,.2,1)
    .45s
    forwards;
}

@keyframes phoneReveal{

  0%{
    transform:
      translate(-50%,130vh)
      scale(.72);

    opacity:0;
  }

  55%{
    transform:
      translate(-50%,-57%)
      scale(1.05);

    opacity:1;
  }

  75%{
    transform:
      translate(-50%,-48%)
      scale(.98);

    opacity:1;
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);

    opacity:1;
  }

}

/* =========================
   PHONE LIGHT
========================= */

.phoneLight{
  position:absolute;

  z-index:9;

  left:50%;
  top:55%;

  width:310px;
  height:520px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,220,255,.22),
      transparent 65%
    );

  filter:blur(30px);

  opacity:0;

  animation:
    phoneLightIn
    1.5s ease
    .8s
    forwards;
}

@keyframes phoneLightIn{

  to{
    opacity:1;
  }

}

/* =========================
   BRAND
========================= */

.brand{
  position:absolute;

  z-index:30;

  left:50%;
  top:10%;

  width:100%;

  transform:
    translate(-50%,30px)
    scale(.92);

  opacity:0;

  text-align:center;

  pointer-events:none;
}

.brand.show{

  animation:
    brandShow
    1.6s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}

@keyframes brandShow{

  0%{
    opacity:0;

    transform:
      translate(-50%,30px)
      scale(.92);
  }

  100%{
    opacity:1;

    transform:
      translate(-50%,0)
      scale(1);
  }

}

/* =========================
   LAXMI
========================= */

.laxmi{

  display:block;

  width:min(210px,48vw);

  max-height:90px;

  object-fit:contain;

  margin:0 auto;

  mix-blend-mode:screen;

  filter:
    drop-shadow(
      0 3px 8px
      rgba(0,0,0,.8)
    )
    drop-shadow(
      0 0 12px
      rgba(220,245,255,.28)
    );
}

/* =========================
   NARASHMA
========================= */

.narashma{

  display:block;

  width:min(280px,65vw);

  max-height:105px;

  object-fit:contain;

  margin:6px auto 0;

  mix-blend-mode:screen;

  filter:
    drop-shadow(
      0 3px 8px
      rgba(0,0,0,.8)
    )
    drop-shadow(
      0 0 14px
      rgba(0,220,255,.25)
    );
}

/* =========================
   ENTER AREA
========================= */

.enter{

  position:absolute;

  z-index:40;

  left:50%;
  bottom:7%;

  transform:
    translate(-50%,25px);

  opacity:0;

  text-align:center;

  animation:
    enterShow
    1.2s
    ease
    4.1s
    forwards;
}

@keyframes enterShow{

  to{
    opacity:1;

    transform:
      translate(-50%,0);
  }

}

.enterText{

  color:#fff;

  font-size:11px;

  letter-spacing:4px;

  margin-bottom:13px;

  opacity:.78;

  text-shadow:
    0 0 10px
    rgba(0,220,255,.35);
}

.enterButton{

  border:
    1px solid
    rgba(255,255,255,.65);

  background:
    rgba(0,20,30,.35);

  color:#fff;

  padding:
    13px 30px;

  border-radius:30px;

  font-size:13px;

  letter-spacing:2px;

  cursor:pointer;

  backdrop-filter:
    blur(14px);

  box-shadow:
    0 0 18px
    rgba(0,220,255,.12);

  transition:
    .3s ease;
}

.enterButton:hover{

  background:
    rgba(0,180,220,.18);

  border-color:
    rgba(0,220,255,.8);

  box-shadow:
    0 0 25px
    rgba(0,220,255,.28);

  transform:scale(1.04);
}

/* =========================
   FADE OUT
========================= */

.fadeOut{

  opacity:0;

  pointer-events:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .store{
    background-position:
      center center;
  }

  .phone{

    width:205px;

  }

  .phoneLight{

    width:240px;
    height:440px;

  }

  .glow{

    width:330px;
    height:330px;

  }

  .brand{

    top:8%;

  }

  .laxmi{

    width:160px;

    max-height:70px;

  }

  .narashma{

    width:225px;

    max-height:85px;

  }

  .enter{

    bottom:6%;

  }

  .enterText{

    font-size:10px;

    letter-spacing:3px;

  }

  .enterButton{

    padding:
      12px 27px;

  }

}

</style>
</head>


<body>

<div
  class="scene"
  id="scene"
>

  <!-- SHOWROOM -->

  <div class="store"></div>


  <!-- CYAN LIGHT -->

  <div class="glow"></div>

  <div class="phoneLight"></div>


  <!-- PHONE -->

  <img
    src="final-phone.png"
    class="phone"
    id="phone"
    alt="Premium Smartphone"
  >


  <!-- BRAND -->

  <div
    class="brand"
    id="brand"
  >

    <img
      src="laxmi.png"
      class="laxmi"
      alt="Laxmi"
    >

    <img
      src="narashma.png"
      class="narashma"
      alt="Narashma"
    >

  </div>


  <!-- ENTER -->

  <div class="enter">

    <div class="enterText">
      PREMIUM MOBILE EXPERIENCE
    </div>

    <button
      class="enterButton"
      onclick="openLogin()"
    >
      ENTER STORE
    </button>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const brand =
  document.getElementById("brand");

const scene =
  document.getElementById("scene");


/* =========================
   BRAND TIMING
========================= */

window.addEventListener(
  "load",
  function(){

    setTimeout(
      function(){

        brand.classList.add("show");

      },
      3000
    );

  }
);


/* =========================
   OPEN LOGIN
========================= */

function openLogin(){

  scene.classList.add(
    "fadeOut"
  );

  setTimeout(
    function(){

      window.location.href =
        "login.html";

    },
    900
  );

}

</script>

</body>
</html>
