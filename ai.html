<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Narashma Mobile Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#242424 0%,#0b0b0b 42%,#000 100%);
}

/* Big background name */
.ghost{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(60px,13vw,190px);
  font-weight:900;
  letter-spacing:-7px;
  white-space:nowrap;
  color:rgba(255,255,255,.035);
  pointer-events:none;
}

/* Header */
.brand{
  position:absolute;
  top:25px;
  left:28px;
  z-index:50;
  font-size:14px;
  font-weight:800;
  letter-spacing:2px;
}

.brand small{
  display:block;
  margin-top:5px;
  color:#888;
  font-size:9px;
  letter-spacing:3px;
}

.logout{
  position:absolute;
  top:22px;
  right:25px;
  z-index:50;
  border:1px solid #444;
  background:rgba(255,255,255,.06);
  color:white;
  padding:10px 17px;
  border-radius:25px;
  cursor:pointer;
}

/* 3D stage */
.stage{
  position:absolute;
  width:100%;
  height:620px;
  top:52%;
  left:50%;
  transform:translate(-50%,-50%);
  perspective:1400px;
}

/* Phone */
.phone{
  position:absolute;
  width:235px;
  height:475px;
  top:50%;
  left:50%;

  transform-style:preserve-3d;
  transform-origin:center;

  border-radius:34px;
  overflow:hidden;

  background:
    linear-gradient(135deg,#333,#111 45%,#000);

  border:1px solid rgba(255,255,255,.25);

  box-shadow:
    0 35px 90px rgba(0,0,0,.8),
    inset 0 0 25px rgba(255,255,255,.06);

  transition:
    transform .7s cubic-bezier(.2,.8,.2,1),
    opacity .7s ease,
    filter .7s ease;

  cursor:pointer;
}

.phone::before{
  content:"";
  position:absolute;
  top:7px;
  left:8px;
  right:8px;
  bottom:7px;
  border-radius:29px;
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
  z-index:5;
}

.phone img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Glass reflection */
.phone::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.18),
      transparent 22%,
      transparent 65%,
      rgba(255,255,255,.04)
    );
  pointer-events:none;
}

/* Phone names */
.info{
  position:absolute;
  left:18px;
  bottom:18px;
  z-index:10;
  text-shadow:0 2px 8px #000;
}

.info .maker{
  color:#aaa;
  font-size:9px;
  letter-spacing:3px;
}

.info .model{
  margin-top:5px;
  font-size:21px;
  font-weight:800;
}

/* 3D positions */
.center{
  transform:
    translate(-50%,-50%)
    translateZ(120px)
    rotateY(0deg)
    scale(1.05);
  opacity:1;
  z-index:10;
}

.right{
  transform:
    translate(calc(-50% + 285px),-50%)
    translateZ(-100px)
    rotateY(-28deg)
    rotateZ(3deg)
    scale(.72);
  opacity:.58;
  filter:brightness(.62);
  z-index:6;
}

.left{
  transform:
    translate(calc(-50% - 285px),-50%)
    translateZ(-100px)
    rotateY(28deg)
    rotateZ(-3deg)
    scale(.72);
  opacity:.58;
  filter:brightness(.62);
  z-index:6;
}

.back-right{
  transform:
    translate(calc(-50% + 490px),-50%)
    translateZ(-250px)
    rotateY(-48deg)
    scale(.52);
  opacity:.18;
  filter:brightness(.3) blur(2px);
  z-index:3;
}

.back-left{
  transform:
    translate(calc(-50% - 490px),-50%)
    translateZ(-250px)
    rotateY(48deg)
    scale(.52);
  opacity:.18;
  filter:brightness(.3) blur(2px);
  z-index:3;
}

.hidden{
  transform:
    translate(-50%,-50%)
    translateZ(-500px)
    scale(.2);
  opacity:0;
  pointer-events:none;
}

/* Arrows */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid #444;
  background:rgba(255,255,255,.07);
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:40;
}

.arrow:hover{
  background:white;
  color:black;
}

.prev{
  left:25px;
}

.next{
  right:25px;
}

/* AI panel */
.panel{
  position:absolute;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  width:min(440px,90vw);
  padding:16px;
  border:1px solid #333;
  border-radius:20px;
  background:rgba(5,5,5,.86);
  backdrop-filter:blur(18px);
  z-index:45;
  display:none;
}

.panel.show{
  display:block;
}

.panel-title{
  color:#999;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.problems{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.problem{
  padding:11px;
  border-radius:11px;
  border:1px solid #333;
  background:#111;
  color:white;
  cursor:pointer;
}

.problem:hover{
  background:white;
  color:black;
}

/* Bottom */
.bottom{
  position:absolute;
  left:28px;
  bottom:25px;
  z-index:30;
}

.bottom small{
  color:#777;
  letter-spacing:3px;
}

.bottom h2{
  margin-top:6px;
  font-size:17px;
  letter-spacing:2px;
}

.discover{
  position:absolute;
  right:28px;
  bottom:30px;
  z-index:30;
  color:#aaa;
  font-size:11px;
  letter-spacing:2px;
  cursor:pointer;
}

/* Mobile */
@media(max-width:700px){

  .stage{
    height:530px;
  }

  .phone{
    width:200px;
    height:400px;
  }

  .center{
    transform:
      translate(-50%,-50%)
      translateZ(80px)
      scale(.95);
  }

  .right{
    transform:
      translate(calc(-50% + 155px),-50%)
      translateZ(-80px)
      rotateY(-25deg)
      scale(.62);
  }

  .left{
    transform:
      translate(calc(-50% - 155px),-50%)
      translateZ(-80px)
      rotateY(25deg)
      scale(.62);
  }

  .back-right{
    transform:
      translate(calc(-50% + 270px),-50%)
      translateZ(-180px)
      rotateY(-40deg)
      scale(.43);
  }

  .back-left{
    transform:
      translate(calc(-50% - 270px),-50%)
      translateZ(-180px)
      rotateY(40deg)
      scale(.43);
  }

  .arrow{
    width:44px;
    height:44px;
  }

  .prev{
    left:8px;
  }

  .next{
    right:8px;
  }

  .brand{
    left:18px;
    top:18px;
  }

  .logout{
    right:18px;
    top:16px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="ghost">LAXMI NARASHMA</div>

  <div class="brand">
    LAXMI NARASHMA
    <small>MOBILE SHOP</small>
  </div>

  <button class="logout" onclick="logoutUser()">
    Logout
  </button>

  <div class="stage">

    <!-- NOTHING -->
    <div class="phone center"
         data-brand="NOTHING"
         data-model="Phone (2)"
         onclick="selectPhone(this)">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Nothing_phone_(2)_(Booredatwork.com)_001.png"
        alt="Nothing Phone 2">

      <div class="info">
        <div class="maker">NOTHING</div>
        <div class="model">Phone (2)</div>
      </div>
    </div>

    <!-- IPHONE -->
    <div class="phone right"
         data-brand="APPLE"
         data-model="iPhone 15"
         onclick="selectPhone(this)">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Apple_iPhone_15.png"
        alt="iPhone 15">

      <div class="info">
        <div class="maker">APPLE</div>
        <div class="model">iPhone 15</div>
      </div>
    </div>

    <!-- SAMSUNG -->
    <div class="phone back-right"
         data-brand="SAMSUNG"
         data-model="Galaxy S24"
         onclick="selectPhone(this)">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Samsung_Galaxy_S24_02.jpg"
        alt="Samsung Galaxy S24">

      <div class="info">
        <div class="maker">SAMSUNG</div>
        <div class="model">Galaxy S24</div>
      </div>
    </div>

    <!-- REDMI -->
    <div class="phone left"
         data-brand="REDMI"
         data-model="Redmi"
         onclick="selectPhone(this)">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Xiaomi_Redmi_A1%2B.jpg"
        alt="Redmi">

      <div class="info">
        <div class="maker">REDMI</div>
        <div class="model">Redmi</div>
      </div>
    </div>

    <!-- OPPO -->
    <div class="phone back-left"
         data-brand="OPPO"
         data-model="OPPO"
         onclick="selectPhone(this)">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Oppo_A57.jpg"
        alt="OPPO">

      <div class="info">
        <div class="maker">OPPO</div>
        <div class="model">OPPO</div>
      </div>
    </div>

  </div>

  <button class="arrow prev" onclick="previousPhone()">‹</button>
  <button class="arrow next" onclick="nextPhone()">›</button>

  <div class="panel" id="panel">

    <div class="panel-title" id="selected">
      AI MOBILE DIAGNOSTIC
    </div>

    <div class="problems">

      <button class="problem" onclick="repair('Screen Damage')">
        📱 Screen Damage
      </button>

      <button class="problem" onclick="repair('Battery Problem')">
        🔋 Battery Problem
      </button>

      <button class="problem" onclick="repair('Charging Problem')">
        ⚡ Charging Problem
      </button>

      <button class="problem" onclick="repair('Camera Problem')">
        📷 Camera Problem
      </button>

      <button class="problem" onclick="repair('Software Problem')">
        ⚙️ Software Problem
      </button>

      <button class="problem" onclick="repair('Other Problem')">
        🛠 Other Problem
      </button>

    </div>
  </div>

  <div class="bottom">
    <small>SMART SERVICE</small>
    <h2>MOBILE AI ASSISTANT</h2>
  </div>

  <div class="discover" onclick="nextPhone()">
    DISCOVER MODELS →
  </div>

</div>

<script>

const phones =
  Array.from(document.querySelectorAll(".phone"));

let current = 0;

function update(){

  phones.forEach((phone,index)=>{

    phone.classList.remove(
      "center",
      "right",
      "left",
      "back-right",
      "back-left",
      "hidden"
    );

    const position =
      (index-current+phones.length)%phones.length;

    if(position === 0){
      phone.classList.add("center");
    }
    else if(position === 1){
      phone.classList.add("right");
    }
    else if(position === 2){
      phone.classList.add("back-right");
    }
    else if(position === phones.length-1){
      phone.classList.add("left");
    }
    else if(position === phones.length-2){
      phone.classList.add("back-left");
    }
    else{
      phone.classList.add("hidden");
    }

  });

  updateTitle();
}

function nextPhone(){

  current =
    (current+1)%phones.length;

  update();
}

function previousPhone(){

  current =
    (current-1+phones.length)%phones.length;

  update();
}

function selectPhone(phone){

  const index =
    phones.indexOf(phone);

  if(index === -1) return;

  current = index;

  update();

  document
    .getElementById("panel")
    .classList.add("show");
}

function updateTitle(){

  const phone = phones[current];

  document.getElementById("selected").textContent =
    phone.dataset.brand +
    " • " +
    phone.dataset.model +
    " — AI DIAGNOSTIC";
}

function repair(problem){

  const phone = phones[current];

  alert(
    "LAXMI NARASHMA MOBILE SHOP\n\n" +
    "Brand: " + phone.dataset.brand + "\n" +
    "Model: " + phone.dataset.model + "\n\n" +
    "Problem: " + problem
  );
}

function logoutUser(){

  if(
    typeof supabaseClient !== "undefined" &&
    supabaseClient.auth
  ){

    supabaseClient.auth.signOut()
      .then(()=>{
        window.location.href="login.html";
      });

  }else{

    window.location.href="login.html";

  }
}

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowRight"){
    nextPhone();
  }

  if(e.key === "ArrowLeft"){
    previousPhone();
  }

});

update();

</script>

</body>
</html>
