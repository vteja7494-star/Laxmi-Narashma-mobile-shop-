<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Narashma Mobile Shop</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050607;
  font-family:Arial,sans-serif;
}

.scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 55%,rgba(80,120,130,.16),transparent 35%),
    linear-gradient(180deg,#101416,#030506 75%);
}

/* SHOWROOM */
.store{
  position:absolute;
  inset:0;
  background-image:url("store.png");
  background-size:cover;
  background-position:center;
  transition:filter 2s ease,transform 2s ease;
}

.store.blur{
  filter:blur(9px) brightness(.65);
  transform:scale(1.04);
}

/* CENTRAL LIGHT */
.light{
  position:absolute;
  left:50%;
  top:58%;
  width:340px;
  height:340px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(70,220,255,.28),
    rgba(70,220,255,.08) 35%,
    transparent 70%
  );
  filter:blur(10px);
  opacity:0;
  transition:opacity 1s;
}

.light.active{
  opacity:1;
}

/* PHONE */
.phone{
  position:absolute;
  left:50%;
  top:55%;
  width:min(230px,34vw);
  transform:translate(-50%,-50%) translateY(120vh);
  opacity:0;
  z-index:10;
  filter:
    drop-shadow(0 20px 35px rgba(0,0,0,.7))
    drop-shadow(0 0 18px rgba(60,220,255,.22));
}

.phone.rise{
  animation:phoneRise 1.5s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes phoneRise{
  from{
    transform:translate(-50%,-50%) translateY(120vh);
    opacity:0;
  }
  to{
    transform:translate(-50%,-50%) translateY(0);
    opacity:1;
  }
}

/* EXPLODED IMAGE */
.exploded{
  position:absolute;
  left:50%;
  top:55%;
  width:min(650px,80vw);
  transform:translate(-50%,-50%) scale(.5);
  opacity:0;
  z-index:20;
  pointer-events:none;
}

.exploded.show{
  animation:explodeShow 1.4s ease forwards;
}

@keyframes explodeShow{
  from{
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
  }
  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

.exploded.rotate{
  animation:rotation 10s linear infinite;
}

@keyframes rotation{
  from{
    transform:translate(-50%,-50%) rotateY(0deg) scale(1);
  }
  to{
    transform:translate(-50%,-50%) rotateY(360deg) scale(1);
  }
}

/* REASSEMBLE */
.reassemble{
  position:absolute;
  left:50%;
  top:55%;
  width:min(650px,80vw);
  transform:translate(-50%,-50%) scale(1.15);
  opacity:0;
  z-index:30;
}

.reassemble.show{
  animation:reassemble 8s ease forwards;
}

@keyframes reassemble{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }

  70%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.82);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
  }
}

/* FINAL PHONE */
.finalPhone{
  position:absolute;
  left:50%;
  top:55%;
  width:min(240px,36vw);
  transform:translate(-50%,-50%) scale(.7);
  opacity:0;
  z-index:40;
}

.finalPhone.show{
  animation:finalReveal 2s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes finalReveal{
  from{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

/* LOGO */
.logo{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  z-index:50;
  text-align:center;
  opacity:0;
}

.logo.show{
  animation:logoReveal 2.5s ease forwards;
}

.laxmi{
  display:block;
  color:#f4f4f4;
  font-family:Georgia,serif;
  font-size:clamp(30px,5vw,65px);
  letter-spacing:10px;
  text-shadow:
    0 0 10px rgba(255,255,255,.5),
    0 0 25px rgba(100,220,255,.3);
}

.narashma{
  display:block;
  margin-top:4px;
  color:#c8cdd0;
  font-family:Arial Black,sans-serif;
  font-size:clamp(24px,4vw,55px);
  letter-spacing:7px;
  text-shadow:
    0 0 10px rgba(255,255,255,.4),
    0 0 20px rgba(80,210,255,.25);
}

@keyframes logoReveal{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(25px);
  }

  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

/* MOBILE VIEW */
@media(max-width:600px){

  .phone,
  .finalPhone{
    width:190px;
  }

  .exploded,
  .reassemble{
    width:95vw;
  }

  .logo{
    top:12%;
  }

  .laxmi{
    font-size:30px;
    letter-spacing:7px;
  }

  .narashma{
    font-size:24px;
    letter-spacing:4px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="store" id="store"></div>

  <div class="light" id="light"></div>

  <!-- PHONE RISE -->
  <img
    src="mobile.png"
    class="phone"
    id="phone"
    alt="Premium smartphone"
  >

  <!-- EXPLODED VIEW -->
  <img
    src="explode-full.png"
    class="exploded"
    id="exploded"
    alt="Exploded smartphone"
  >

  <!-- REASSEMBLY -->
  <img
    src="reassemble.png"
    class="reassemble"
    id="reassemble"
    alt="Smartphone reassembly"
  >

  <!-- FINAL PHONE -->
  <img
    src="final-phone.png"
    class="finalPhone"
    id="finalPhone"
    alt="Final smartphone"
  >

  <!-- LOGO -->
  <div class="logo" id="logo">
    <span class="laxmi">LAXMI</span>
    <span class="narashma">NARASHMA</span>
  </div>

</div>

<script>

const phone = document.getElementById("phone");
const exploded = document.getElementById("exploded");
const reassemble = document.getElementById("reassemble");
const finalPhone = document.getElementById("finalPhone");
const store = document.getElementById("store");
const light = document.getElementById("light");
const logo = document.getElementById("logo");

/*
  CINEMATIC TIMELINE

  0s       → showroom
  0.5s     → light
  1s       → phone rises
  2.5s     → exploded view
  3.9s     → 360 rotation
  13.9s    → reassembly
  21.9s    → final phone
  24s      → logo
*/

window.addEventListener("load", () => {

  /* showroom light */
  setTimeout(() => {
    light.classList.add("active");
  }, 400);

  /* phone rises */
  setTimeout(() => {
    phone.classList.add("rise");
  }, 700);

  /* exploded view */
  setTimeout(() => {

    phone.style.opacity = "0";

    exploded.classList.add("show");

  }, 2500);

  /* rotation */
  setTimeout(() => {

    exploded.classList.add("rotate");

  }, 3900);

  /* reassembly */
  setTimeout(() => {

    exploded.style.opacity = "0";

    reassemble.classList.add("show");

  }, 13900);

  /* final phone */
  setTimeout(() => {

    reassemble.style.opacity = "0";

    store.classList.add("blur");

    finalPhone.classList.add("show");

  }, 21900);

  /* logo reveal */
  setTimeout(() => {

    logo.classList.add("show");

  }, 24000);

});

</script>

</body>
</html>
