<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laxmi Narashma Mobile Shop - AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 45%, #202020 0%, #080808 45%, #000 100%);
      color: white;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Giant background brand */
    .ghost-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(70px, 13vw, 190px);
      font-weight: 900;
      letter-spacing: -8px;
      color: rgba(255,255,255,0.035);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    /* Top brand */
    .top-brand {
      position: absolute;
      top: 28px;
      left: 32px;
      z-index: 20;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .top-brand span {
      display: block;
      margin-top: 5px;
      color: #888;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .logout {
      position: absolute;
      top: 25px;
      right: 28px;
      z-index: 30;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: white;
      padding: 10px 17px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .logout:hover {
      background: white;
      color: black;
    }

    /* Main carousel */
    .carousel {
      position: absolute;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -50%);
      width: min(1000px, 100vw);
      height: 610px;
      z-index: 5;
    }

    .phone-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 245px;
      height: 475px;
      transform-origin: center center;
      transition:
        transform 650ms cubic-bezier(.22,.8,.25,1),
        opacity 650ms ease,
        filter 650ms ease;
      cursor: pointer;
      border-radius: 35px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      border: 1px solid rgba(255,255,255,.15);
    }

    .phone-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .phone-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.02),
          rgba(0,0,0,.05) 55%,
          rgba(0,0,0,.72)
        );
      pointer-events: none;
    }

    .phone-info {
      position: absolute;
      left: 20px;
      bottom: 22px;
      z-index: 4;
    }

    .phone-info .brand {
      font-size: 11px;
      letter-spacing: 3px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .phone-info .model {
      font-size: 23px;
      font-weight: 800;
    }

    /* Positions */
    .pos-center {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      z-index: 10;
      filter: brightness(1);
    }

    .pos-left {
      transform: translate(calc(-50% - 255px), -50%) scale(.72) rotate(-5deg);
      opacity: .55;
      z-index: 6;
      filter: brightness(.65) blur(.2px);
    }

    .pos-right {
      transform: translate(calc(-50% + 255px), -50%) scale(.72) rotate(5deg);
      opacity: .55;
      z-index: 6;
      filter: brightness(.65) blur(.2px);
    }

    .pos-back-left {
      transform: translate(calc(-50% - 430px), -50%) scale(.52) rotate(-9deg);
      opacity: .18;
      z-index: 3;
      filter: brightness(.35) blur(2px);
    }

    .pos-back-right {
      transform: translate(calc(-50% + 430px), -50%) scale(.52) rotate(9deg);
      opacity: .18;
      z-index: 3;
      filter: brightness(.35) blur(2px);
    }

    .pos-hidden {
      transform: translate(-50%, -50%) scale(.35);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Navigation */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 25px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(15px);
      transition: .25s;
    }

    .arrow:hover {
      background: white;
      color: black;
      transform: translateY(-50%) scale(1.08);
    }

    .arrow-left {
      left: 25px;
    }

    .arrow-right {
      right: 25px;
    }

    /* Bottom UI */
    .bottom-left {
      position: absolute;
      bottom: 30px;
      left: 32px;
      z-index: 20;
    }

    .bottom-left .small {
      color: #777;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .bottom-left h2 {
      font-size: 17px;
      letter-spacing: 2px;
    }

    .discover {
      position: absolute;
      right: 32px;
      bottom: 30px;
      z-index: 20;
      font-size: 11px;
      letter-spacing: 2px;
      color: #aaa;
      cursor: pointer;
    }

    .discover:hover {
      color: white;
    }

    /* AI panel */
    .ai-panel {
      position: absolute;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      width: min(430px, 90vw);
      padding: 17px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(10,10,10,.72);
      backdrop-filter: blur(18px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transform-origin: bottom;
      transition: .3s ease;
    }

    .ai-panel.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ai-title {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .problem-btn {
      padding: 11px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: white;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }

    .problem-btn:hover {
      background: white;
      color: black;
    }

    @media (max-width: 700px) {
      body {
        overflow: hidden;
      }

      .top-brand {
        top: 20px;
        left: 20px;
      }

      .logout {
        top: 18px;
        right: 18px;
        padding: 8px 13px;
      }

      .ghost-text {
        font-size: 60px;
      }

      .carousel {
        height: 520px;
      }

      .phone-card {
        width: 205px;
        height: 405px;
      }

      .pos-left {
        transform: translate(calc(-50% - 155px), -50%) scale(.63) rotate(-5deg);
      }

      .pos-right {
        transform: translate(calc(-50% + 155px), -50%) scale(.63) rotate(5deg);
      }

      .pos-back-left {
        transform: translate(calc(-50% - 270px), -50%) scale(.45) rotate(-9deg);
      }

      .pos-back-right {
        transform: translate(calc(-50% + 270px), -50%) scale(.45) rotate(9deg);
      }

      .arrow {
        width: 44px;
        height: 44px;
      }

      .arrow-left {
        left: 10px;
      }

      .arrow-right {
        right: 10px;
      }

      .bottom-left {
        left: 20px;
        bottom: 20px;
      }

      .discover {
        right: 20px;
        bottom: 20px;
      }

      .ai-panel {
        bottom: 75px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="ghost-text">LAXMI NARASHMA</div>

  <div class="top-brand">
    LAXMI NARASHMA
    <span>MOBILE SHOP</span>
  </div>

  <button class="logout" onclick="logoutUser()">Logout</button>

  <div class="carousel" id="carousel">

    <!-- NOTHING -->
    <div class="phone-card pos-center"
         data-brand="NOTHING"
         data-model="Phone (2)"
         onclick="selectPhone(this)">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Nothing_phone_(2)_(Booredatwork.com)_001.png"
        alt="Nothing Phone 2"
        onerror="imageFallback(this)"
      >
      <div class="phone-info">
        <div class="brand">NOTHING</div>
        <div class="model">Phone (2)</div>
      </div>
    </div>

    <!-- IPHONE -->
    <div class="phone-card pos-right"
         data-brand="APPLE"
         data-model="iPhone 15"
         onclick="selectPhone(this)">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Apple_iPhone_15.png"
        alt="Apple iPhone 15"
        onerror="imageFallback(this)"
      >
      <div class="phone-info">
        <div class="brand">APPLE</div>
        <div class="model">iPhone 15</div>
      </div>
    </div>

    <!-- SAMSUNG -->
    <div class="phone-card pos-back-right"
         data-brand="SAMSUNG"
         data-model="Galaxy S24"
         onclick="selectPhone(this)">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Samsung_Galaxy_S24_02.jpg"
        alt="Samsung Galaxy S24"
        onerror="imageFallback(this)"
      >
      <div class="phone-info">
        <div class="brand">SAMSUNG</div>
        <div class="model">Galaxy S24</div>
      </div>
    </div>

    <!-- OPPO -->
    <div class="phone-card pos-back-left"
         data-brand="OPPO"
         data-model="OPPO Smartphone"
         onclick="selectPhone(this)">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/%D9%87%D8%A7%D8%AA%D9%81_oppo_%D8%A7%D9%84%D8%AC%D8%AF%D9%8A%D8%AF.jpg"
        alt="OPPO Smartphone"
        onerror="imageFallback(this)"
      >
      <div class="phone-info">
        <div class="brand">OPPO</div>
        <div class="model">Smartphone</div>
      </div>
    </div>

    <!-- REDMI -->
    <div class="phone-card pos-left"
         data-brand="REDMI"
         data-model="Redmi A1+"
         onclick="selectPhone(this)">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A1%D0%BC%D0%B0%D1%80%D1%82%D1%84%D0%BE%D0%BD_Xiaomi_Redmi_A1%2B_%D0%B7%D0%B0%D0%B4%D0%BD%D1%8F%D1%8F_%D0%BA%D1%80%D1%8B%D1%88%D0%BA%D0%B0.jpg"
        alt="Redmi A1 Plus"
        onerror="imageFallback(this)"
      >
      <div class="phone-info">
        <div class="brand">REDMI</div>
        <div class="model">Redmi A1+</div>
      </div>
    </div>

  </div>

  <button class="arrow arrow-left" onclick="previousPhone()">‹</button>
  <button class="arrow arrow-right" onclick="nextPhone()">›</button>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-title" id="selectedPhone">
      AI MOBILE DIAGNOSTIC
    </div>

    <div class="problem-grid">
      <button class="problem-btn" onclick="showRepair('Screen Damage')">
        📱 Screen Damage
      </button>

      <button class="problem-btn" onclick="showRepair('Battery Problem')">
        🔋 Battery Problem
      </button>

      <button class="problem-btn" onclick="showRepair('Charging Problem')">
        ⚡ Charging Problem
      </button>

      <button class="problem-btn" onclick="showRepair('Camera Problem')">
        📷 Camera Problem
      </button>

      <button class="problem-btn" onclick="showRepair('Software Problem')">
        ⚙️ Software Problem
      </button>

      <button class="problem-btn" onclick="showRepair('Other Problem')">
        🛠 Other Problem
      </button>
    </div>
  </div>

  <div class="bottom-left">
    <div class="small">SMART SERVICE</div>
    <h2>MOBILE AI ASSISTANT</h2>
  </div>

  <div class="discover" onclick="nextPhone()">
    DISCOVER MODELS →
  </div>

</div>

<script src="script.js"></script>

<script>

  let phones = Array.from(
    document.querySelectorAll(".phone-card")
  );

  let currentIndex = 0;

  const positions = [
    "pos-center",
    "pos-right",
    "pos-back-right",
    "pos-back-left",
    "pos-left"
  ];

  function updateCarousel() {

    phones.forEach((phone, index) => {

      phone.classList.remove(
        "pos-center",
        "pos-left",
        "pos-right",
        "pos-back-left",
        "pos-back-right",
        "pos-hidden"
      );

      let relative =
        (index - currentIndex + phones.length) %
        phones.length;

      if (relative === 0) {
        phone.classList.add("pos-center");
      }

      else if (relative === 1) {
        phone.classList.add("pos-right");
      }

      else if (relative === 2) {
        phone.classList.add("pos-back-right");
      }

      else if (relative === phones.length - 1) {
        phone.classList.add("pos-left");
      }

      else if (relative === phones.length - 2) {
        phone.classList.add("pos-back-left");
      }

      else {
        phone.classList.add("pos-hidden");
      }

    });

    updateSelectedPhone();
  }


  function nextPhone() {

    currentIndex =
      (currentIndex + 1) %
      phones.length;

    updateCarousel();
  }


  function previousPhone() {

    currentIndex =
      (currentIndex - 1 + phones.length) %
      phones.length;

    updateCarousel();
  }


  function selectPhone(phone) {

    const clickedIndex =
      phones.indexOf(phone);

    if (clickedIndex === -1) {
      return;
    }

    currentIndex = clickedIndex;

    updateCarousel();

    document
      .getElementById("aiPanel")
      .classList.add("active");

  }


  function updateSelectedPhone() {

    const phone = phones[currentIndex];

    if (!phone) {
      return;
    }

    const brand =
      phone.dataset.brand || "";

    const model =
      phone.dataset.model || "";

    document.getElementById("selectedPhone").textContent =
      brand + " • " + model + " — AI DIAGNOSTIC";
  }


  function showRepair(problem) {

    const phone = phones[currentIndex];

    const brand =
      phone?.dataset.brand || "";

    const model =
      phone?.dataset.model || "";

    alert(
      "AI MOBILE DIAGNOSTIC\n\n" +
      "Brand: " + brand + "\n" +
      "Model: " + model + "\n\n" +
      "Problem: " + problem + "\n\n" +
      "Laxmi Narashma Mobile Shop will help you with this repair."
    );
  }


  function imageFallback(img) {

    img.style.display = "none";

    const parent = img.parentElement;

    parent.style.background =
      "linear-gradient(145deg,#1b1b1b,#050505)";

    parent.setAttribute(
      "data-image-error",
      "true"
    );
  }


  function logoutUser() {

    if (
      typeof supabaseClient !== "undefined" &&
      supabaseClient.auth
    ) {

      supabaseClient.auth.signOut()
        .then(() => {
          window.location.href = "login.html";
        });

    } else {

      window.location.href = "login.html";

    }
  }


  /* Keyboard controls */
  document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
      nextPhone();
    }

    if (event.key === "ArrowLeft") {
      previousPhone();
    }

    if (event.key === "Escape") {
      document
        .getElementById("aiPanel")
        .classList.remove("active");
    }

  });


  /* Start */
  updateCarousel();

</script>

</body>
</html>
