<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Narashma</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

.scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* SHOWROOM */
.store{
  position:absolute;
  inset:0;
  background:url("store.png") center/cover no-repeat;
}

/* LIGHT */
.glow{
  position:absolute;
  left:50%;
  top:55%;
  width:400px;
  height:400px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(0,220,255,.25),
    transparent 70%
  );
  filter:blur(25px);
}

/* PHONE */
.phone{
  position:absolute;
  left:50%;
  top:55%;
  width:min(260px,55vw);
  transform:translate(-50%,130vh) scale(.8);
  opacity:0;
  z-index:5;
  filter:
    drop-shadow(0 25px 35px rgba(0,0,0,.8))
    drop-shadow(0 0 25px rgba(0,220,255,.3));
  animation:phoneReveal 1.8s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes phoneReveal{
  0%{
    transform:translate(-50%,130vh) scale(.8);
    opacity:0;
  }

  65%{
    transform:translate(-50%,-55%) scale(1.05);
    opacity:1;
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

/* CINEMATIC MOVE */
.phone.move{
  animation:cinematicMove 1.2s ease-in-out forwards;
}

@keyframes cinematicMove{
  0%{
    transform:translate(-50%,-50%) scale(1);
  }

  50%{
    transform:translate(-50%,-50%) scale(1.08) rotateY(8deg);
  }

  100%{
    transform:translate(-50%,-50%) scale(1) rotateY(0deg);
  }
}

/* LOGO */
.logo{
  position:absolute;
  left:50%;
  top:12%;
  transform:translate(-50%,20px);
  opacity:0;
  z-index:10;
  text-align:center;
}

.logo.show{
  animation:logoShow .8s ease forwards;
}

.logo img{
  display:block;
  margin:auto;
}

.laxmi{
  width:min(210px,48vw);
}

.narashma{
  width:min(270px,60vw);
  margin-top:8px !important;
}

@keyframes logoShow{
  to{
    opacity:1;
    transform:translate(-50%,0);
  }
}

/* MOBILE */
@media(max-width:600px){

  .phone{
    width:190px;
  }

  .laxmi{
    width:160px;
  }

  .narashma{
    width:210px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="store"></div>

  <div class="glow"></div>

  <!-- MAIN PHONE -->
  <img
    src="mobile.png"
    class="phone"
    id="phone"
    alt="Premium Mobile"
  >

  <!-- LOGO -->
  <div class="logo" id="logo">

    <img
      src="laxmi.png"
      class="laxmi"
      alt="Laxmi"
    >

    <img
      src="narashma.png"
      class="narashma"
      alt="Narashma"
    >

  </div>

</div>

<script>

window.addEventListener("load",function(){

  const phone =
    document.getElementById("phone");

  const logo =
    document.getElementById("logo");

  /*
    0.0s → 1.8s
    Phone rises from showroom

    1.8s → 3.0s
    Cinematic final movement
  */

  setTimeout(function(){
    phone.classList.add("move");
  },1800);

  setTimeout(function(){
    logo.classList.add("show");
  },2200);

});

</script>

</body>
</html>
