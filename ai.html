<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Laxmi Narashma Mobile Shop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      transition:
        background-color 650ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.08'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      background-repeat: repeat;
    }

    .ghost-text {
      position: absolute;
      inset-inline: 0;
      top: 18%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;

      font-family: "Anton", sans-serif;
      font-size: clamp(90px, 28vw, 380px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: white;
      opacity: 1;
    }

    .brand {
      position: absolute;
      top: 24px;
      left: 16px;
      z-index: 60;

      color: white;
      opacity: 0.9;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .carousel {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .mobile-item {
      position: absolute;
      aspect-ratio: 0.6 / 1;

      transition:
        transform 650ms cubic-bezier(0.4, 0, 0.2, 1),
        filter 650ms cubic-bezier(0.4, 0, 0.2, 1),
        opacity 650ms cubic-bezier(0.4, 0, 0.2, 1),
        left 650ms cubic-bezier(0.4, 0, 0.2, 1);

      will-change: transform, filter, opacity;
    }

    .mobile-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .bottom-left {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 60;
      max-width: 320px;
    }

    .title {
      margin-bottom: 10px;

      color: white;
      opacity: 0.95;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .description {
      margin-bottom: 20px;

      color: white;
      opacity: 0.85;
      font-size: 14px;
      line-height: 1.6;
    }

    .navigation {
      display: flex;
      gap: 12px;
    }

    .nav-button {
      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid white;
      border-radius: 50%;
      background: transparent;
      color: white;

      cursor: pointer;

      transition:
        transform 150ms ease,
        background-color 150ms ease;
    }

    .nav-button:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-button svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.25;
    }

    .discover {
      position: absolute;
      right: 16px;
      bottom: 24px;
      z-index: 60;

      display: flex;
      align-items: center;
      gap: 10px;

      color: white;
      opacity: 0.95;

      font-family: "Anton", sans-serif;
      font-size: clamp(20px, 4vw, 56px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      text-decoration: none;
      text-transform: uppercase;

      transition: opacity 200ms ease;
    }

    .discover:hover {
      opacity: 1;
    }

    .discover svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.25;
    }

    @media (min-width: 640px) {
      .brand {
        left: 32px;
      }

      .bottom-left {
        bottom: 80px;
        left: 96px;
      }

      .title {
        margin-bottom: 12px;
        font-size: 22px;
      }

      .description {
        margin-bottom: 20px;
      }

      .discover {
        right: 40px;
        bottom: 80px;
      }
    }

    @media (max-width: 639px) {
      .description {
        display: none;
      }

      .nav-button {
        width: 48px;
        height: 48px;
      }

      .nav-button svg {
        width: 24px;
        height: 24px;
      }

      .discover svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="hero" id="hero">

    <div class="grain"></div>

    <div class="ghost-text">
      MOBILE
    </div>

    <div class="brand">
      LAXMI NARASHMA MOBILE SHOP
    </div>

    <div class="carousel" id="carousel"></div>

    <div class="bottom-left">

      <p class="title">
        PREMIUM MOBILES
      </p>

      <p class="description">
        Explore premium smartphones with a smooth showroom-style
        presentation. Choose your favourite mobile and discover more.
      </p>

      <div class="navigation">

        <button
          class="nav-button"
          id="prevButton"
          aria-label="Previous mobile"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>

        <button
          class="nav-button"
          id="nextButton"
          aria-label="Next mobile"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>

      </div>
    </div>

    <a
      href="#"
      class="discover"
      id="discoverButton"
    >
      DISCOVER IT

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M5 12h14"></path>
        <path d="m12 5 7 7-7 7"></path>
      </svg>
    </a>

  </div>

  <script>
    const IMAGES = [
      {
        src: "https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=900&q=90",
        bg: "#F4845F"
      },
      {
        src: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=90",
        bg: "#6BBF7A"
      },
      {
        src: "https://images.unsplash.com/photo-1592286927505-1def25115558?auto=format&fit=crop&w=900&q=90",
        bg: "#E882B4"
      },
      {
        src: "https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=900&q=90",
        bg: "#6EB5FF"
      }
    ];

    const hero = document.getElementById("hero");
    const carousel = document.getElementById("carousel");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");

    let activeIndex = 0;
    let isAnimating = false;
    let isMobile = window.innerWidth < 640;

    /* Preload images */
    IMAGES.forEach((item) => {
      const image = new Image();
      image.src = item.src;
    });

    /* Create carousel items */
    IMAGES.forEach((item, index) => {

      const container = document.createElement("div");

      container.className = "mobile-item";
      container.dataset.index = index;

      const image = document.createElement("img");

      image.src = item.src;
      image.alt = "Premium smartphone";
      image.draggable = false;

      container.appendChild(image);
      carousel.appendChild(container);
    });

    function updateMobileState() {
      isMobile = window.innerWidth < 640;
      render();
    }

    function getRole(index) {

      const center = activeIndex;
      const left = (activeIndex + 3) % 4;
      const right = (activeIndex + 1) % 4;

      if (index === center) return "center";
      if (index === left) return "left";
      if (index === right) return "right";

      return "back";
    }

    function applyRoleStyle(element, role) {

      if (role === "center") {

        element.style.transform =
          `translateX(-50%) scale(${isMobile ? 1.15 : 1.35})`;

        element.style.filter = "none";
        element.style.opacity = "1";
        element.style.zIndex = "20";
        element.style.left = "50%";
        element.style.height = isMobile ? "62%" : "88%";
        element.style.bottom = isMobile ? "22%" : "2%";

        return;
      }

      if (role === "left") {

        element.style.transform =
          "translateX(-50%) scale(1)";

        element.style.filter = "blur(2px)";
        element.style.opacity = "0.82";
        element.style.zIndex = "10";
        element.style.left = isMobile ? "18%" : "29%";
        element.style.height = isMobile ? "18%" : "30%";
        element.style.bottom = isMobile ? "31%" : "12%";

        return;
      }

      if (role === "right") {

        element.style.transform =
          "translateX(-50%) scale(1)";

        element.style.filter = "blur(2px)";
        element.style.opacity = "0.82";
        element.style.zIndex = "10";
        element.style.left = isMobile ? "82%" : "71%";
        element.style.height = isMobile ? "18%" : "30%";
        element.style.bottom = isMobile ? "31%" : "12%";

        return;
      }

      element.style.transform =
        "translateX(-50%) scale(1)";

      element.style.filter = "blur(4px)";
      element.style.opacity = "0.7";
      element.style.zIndex = "5";
      element.style.left = "50%";
      element.style.height = isMobile ? "14%" : "23%";
      element.style.bottom = isMobile ? "31%" : "12%";
    }

    function render() {

      hero.style.backgroundColor =
        IMAGES[activeIndex].bg;

      const items =
        document.querySelectorAll(".mobile-item");

      items.forEach((item) => {

        const index =
          Number(item.dataset.index);

        const role =
          getRole(index);

        applyRoleStyle(item, role);
      });
    }

    function navigate(direction) {

      if (isAnimating) return;

      isAnimating = true;

      if (direction === "next") {
        activeIndex =
          (activeIndex + 1) % 4;
      } else {
        activeIndex =
          (activeIndex + 3) % 4;
      }

      render();

      setTimeout(() => {
        isAnimating = false;
      }, 650);
    }

    prevButton.addEventListener(
      "click",
      () => navigate("prev")
    );

    nextButton.addEventListener(
      "click",
      () => navigate("next")
    );

    document
      .getElementById("discoverButton")
      .addEventListener("click", (event) => {
        event.preventDefault();
      });

    window.addEventListener(
      "resize",
      updateMobileState
    );

    render();
  </script>

</body>
</html>
